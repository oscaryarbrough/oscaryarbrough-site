<title>DEEP SPACE — Ozzy Shizzle</title>
<meta name="description" content="He is up here somewhere, holding every groove on earth.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="/_shared/img/favicon-32.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #02020a; overflow: hidden; }
  body {
    /* iOS: press-and-hold steering must never select text or pop the loupe */
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
  }
  canvas { display: block; cursor: crosshair; touch-action: none; }
  .hud {
    position: fixed; left: 16px; bottom: 14px; z-index: 10;
    color: #9fb4d8; font: 12px/1.6 "Courier New", monospace;
    letter-spacing: 0.06em; max-width: 34rem; pointer-events: none;
    text-shadow: 0 0 8px rgba(0,0,0,0.9);
  }
  .hud strong { color: #fff; }
  .exits {
    position: fixed; right: 16px; bottom: 14px; z-index: 10;
    font: 12px/2 "Courier New", monospace; text-align: right;
  }

  .exits a:hover { color: #02020a; background: #9fb4d8; }
  .title {
    position: fixed; top: 18px; left: 0; right: 0; text-align: center;
    color: #dfe8ff; font: 13px "Courier New", monospace;
    letter-spacing: 0.4em; z-index: 10; pointer-events: none;
    text-transform: uppercase; opacity: 0.8;
  }
  body.warping .hud, body.warping .exits, body.warping .title { display: none; }

  /* after the fight */
  #outside {
    position: fixed; left: 0; right: 0; bottom: 7vh; z-index: 70;
    text-align: center; opacity: 0; transition: opacity 3.5s ease;
    pointer-events: none;
    font: 13px/2 "Courier New", monospace; letter-spacing: 0.12em;
    color: #dfe8ff; text-shadow: 0 0 12px rgba(0,0,0,0.9);
  }
  #outside.on { opacity: 1; pointer-events: auto; }
  #outside .big { font-size: 15px; letter-spacing: 0.22em; }
  #outside .small { color: #9fb4d8; }
  #outside a { color: #9fb4d8; text-decoration: none; border-bottom: 1px solid #40507a; }
  #outside a:hover { color: #02020a; background: #9fb4d8; }

}
function blip(freq, dur, type, vol) {
  var a = audio(); if (!a) return;
  var o = a.createOscillator(), g = a.createGain();
  o.type = type || 'square';
  o.frequency.value = freq;
  g.gain.setValueAtTime(vol || 0.06, a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + dur);
  o.connect(g).connect(a.destination);
  o.start(); o.stop(a.currentTime + dur);
}
function noiseHit(dur, vol) {
  var a = audio(); if (!a) return;
  var n = a.createBufferSource();
  var buf = a.createBuffer(1, Math.max(1, Math.floor(a.sampleRate * dur)), a.sampleRate);
  var d = buf.getChannelData(0);
  for (var i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
  n.buffer = buf;
  var g = a.createGain();
  g.gain.value = vol || 0.12;
  n.connect(g).connect(a.destination);
  n.start();
}
function kick(vol) {
  var a = audio(); if (!a) return;
  var o = a.createOscillator(), g = a.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(110, a.currentTime);
  o.frequency.exponentialRampToValueAtTime(38, a.currentTime + 0.12);
  g.gain.setValueAtTime(vol || 0.25, a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + 0.15);
  o.connect(g).connect(a.destination);
  o.start(); o.stop(a.currentTime + 0.16);
}

var hud = document.getElementById('hud');

function stageDefault() {

var FACE_W = 58, FACE_H = 70;
var faceStars = null;
function decodeFace() {
  faceStars = [];
  for (var i = 0; i < FACEMAP.length; i += 5) {
    var gx = +FACEMAP.slice(i, i + 2);
    var gy = +FACEMAP.slice(i + 2, i + 4);
    var l = +FACEMAP.charAt(i + 4);
    faceStars.push({
      gx: gx, gy: gy, l: l,
      tw: Math.random() * 6.28,
      sp: 0.4 + Math.random() * 0.9,
      delay: Math.random() * 55,
      jx: (Math.random() - 0.5) * 0.6,
      jy: (Math.random() - 0.5) * 0.6
    });
  }
}
function faceColor(l) {

}

function starColor(l) { return boss && boss.form === 2 ? demonColor(l) : faceColor(l); }

function drawBackdrop() {
  ctx.fillStyle = '#02020a';

  for (var i = 0; i < stars.length; i++) {

    var alpha = reduced ? 0.6 : 0.35 + 0.65 * Math.abs(Math.sin(s.tw + gt * 0.0006 * s.sp));
    ctx.fillStyle = 'rgba(223, 232, 255, ' + alpha + ')';
    ctx.fillRect(s.x * W, s.y * H, s.r, s.r);
  }
  /* the moon, demoted to scenery */
  var mx = W * 0.9, my = H * 0.12, mr = 24;
  ctx.save();
  ctx.beginPath(); ctx.arc(mx, my, mr, 0, 6.29); ctx.clip();
  ctx.fillStyle = '#e8e4d8'; ctx.fillRect(mx - mr, my - mr, mr * 2, mr * 2);
  ctx.fillStyle = '#c9c4b4';
  ctx.beginPath(); ctx.arc(mx - 8, my - 5, 5, 0, 6.29); ctx.fill();
  ctx.beginPath(); ctx.arc(mx + 6, my + 8, 3.5, 0, 6.29); ctx.fill();
  ctx.fillStyle = '#02020a';
  ctx.beginPath(); ctx.arc(mx - mr * 0.55, my - mr * 0.1, mr * 1.02, 0, 6.29); ctx.fill();
  ctx.restore();
}

  ctx.fillStyle = '#ffd52a';
  ctx.fillRect(x - 2, y - 18, 4, 26);
  ctx.beginPath(); ctx.arc(x, y - 20, 3.4, 0, 6.29); ctx.fill();
  ctx.fillStyle = '#b8860b';
  ctx.fillRect(x - 9, y + 8, 18, 5);
  if (!reduced) {
    ctx.fillStyle = 'rgba(123, 42, 255, ' + (0.4 + 0.3 * Math.sin(gt * 0.02)) + ')';
    ctx.fillRect(x - 3, y + 13, 6, 5 + Math.random() * 4);
  }
}
function drawMetro(e) {
  ctx.fillStyle = '#ff5a5a';
  ctx.beginPath();
  ctx.moveTo(e.x - 11, e.y + 10); ctx.lineTo(e.x + 11, e.y + 10); ctx.lineTo(e.x, e.y - 12);
  ctx.closePath(); ctx.fill();
  /* the arm ticks in perfect time. of course it does. */
  var ph = (beatT % 2000) / 2000;
  var tri = ph < 0.5 ? ph * 4 - 1 : 3 - ph * 4;
  ctx.strokeStyle = '#ffe8e8'; ctx.lineWidth = 1.5;

    return;
  }
  var hitR2 = aliveCount < 220 ? 484 : 144; /* 22px radius on a sparse face, else 12px */

    var fs = faceStars[j];
    if (!fs.alive || fs.px === undefined) continue;
    var dx = x - fs.px, dy = y - fs.py;
    near.push([dx * dx + dy * dy, fs]);

  near.sort(function (a, b) { return a[0] - b[0]; });
  var n = Math.min(boss.form === 2 ? TUNE.demonShed : TUNE.bossShed, near.length);
  for (var k = 0; k < n; k++) {
    var fs2 = near[k][1];

    if (particles.length < 2400)

                       vx: Math.cos(ang) * 0.22, vy: Math.sin(ang) * 0.22 - 0.05,
                       life: 900, max: 900, col: starColor(fs2.l) });
  }
  /* if that hit stripped the last of the face, the round ends now —

  for (var j2 = 0; j2 < faceStars.length; j2++) if (faceStars[j2].alive) aliveLeft++;

  player.inv = 0;
  if (reduced) { startDefeat(); return; }
  fin = { t: 0, slashes: [], endAt: 0,
          cx: W / 2 + (boss ? boss.dx : 0), cy: H * 0.27 + (boss ? boss.dy : 0) };
  fin.dashes = [
    mkDash(900, 1500, -0.55),
    mkDash(1750, 2350, -2.59),
    mkDash(2600, 3200, -Math.PI / 2)

  say('finish him.', true);
}
/* kill the stars nearest a slash line, flinging them off sideways */
function slashKill(d, frac) {
  var nx = -(d.y1 - d.y0), ny = d.x1 - d.x0;
  var nl = Math.sqrt(nx * nx + ny * ny) || 1; nx /= nl; ny /= nl;
  var alive = [];
  for (var j = 0; j < faceStars.length; j++) {
    var fs = faceStars[j];
    if (fs.alive && fs.px !== undefined) alive.push(fs);
  }
  alive.sort(function (p, q) {
    return Math.abs((p.px - d.x0) * nx + (p.py - d.y0) * ny) -
           Math.abs((q.px - d.x0) * nx + (q.py - d.y0) * ny);
  });
  var want = Math.min(alive.length, Math.ceil(alive.length * frac));
  for (var k = 0; k < want; k++) {
    var fs2 = alive[k];
    fs2.alive = false;
    var sd = (fs2.px - d.x0) * nx + (fs2.py - d.y0) * ny > 0 ? 1 : -1;
    if (particles.length < 2400)
      particles.push({ x: fs2.px, y: fs2.py,
                       vx: nx * sd * (0.12 + Math.random() * 0.22),
                       vy: ny * sd * (0.12 + Math.random() * 0.22) - 0.03,
                       life: 1100 + Math.random() * 600, max: 1700,
                       col: demonColor(fs2.l) });
  }
}
function runFinish(dt) {
  if (fin.t < 900) {
    /* charge-up: a rising hum */
    if (Math.floor(fin.t / 150) !== Math.floor((fin.t - dt) / 150))
      blip(300 + fin.t * 0.9, 0.06, 'square', 0.05);
    return;
  }
  for (var i = 0; i < fin.dashes.length; i++) {
    var d = fin.dashes[i];
    if (fin.t < d.t0 || fin.t > d.t1) continue;
    var u = (fin.t - d.t0) / (d.t1 - d.t0);
    var e = u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
    player.x = d.x0 + (d.x1 - d.x0) * e;
    player.y = d.y0 + (d.y1 - d.y0) * e;
    if (particles.length < 2400)
      particles.push({ x: player.x, y: player.y,
                       vx: (Math.random() - 0.5) * 0.06, vy: (Math.random() - 0.5) * 0.06,
                       life: 480, max: 480, col: '#ffd52a' });
    if (!d.done && u >= 0.5) {
      /* the blade crosses the face */
      d.done = true;
      fin.slashes.push({ x0: d.x0, y0: d.y0, x1: d.x1, y1: d.y1, life: 700, max: 700 });
      flashT = 220;
      noiseHit(0.2, 0.25);
      blip(1400 - i * 320, 0.18, 'sawtooth', 0.1);
      if (i < 2) slashKill(d, 0.38);
      else { slashKill(d, 1); fin.endAt = d.t1 + 250; }
    }
  }
  if (fin.endAt && fin.t >= fin.endAt) startDefeat();
}
function drawFinish(dt) {
  drawBackdrop();
  if (faceStars) drawBoss();
  for (var i = fin.slashes.length - 1; i >= 0; i--) {
    var s = fin.slashes[i];
    s.life -= dt;
    if (s.life <= 0) { fin.slashes.splice(i, 1); continue; }
    var a = s.life / s.max;
    ctx.strokeStyle = 'rgba(255, 213, 42, ' + (0.5 * a) + ')';
    ctx.lineWidth = 12 * a + 2;
    ctx.beginPath(); ctx.moveTo(s.x0, s.y0); ctx.lineTo(s.x1, s.y1); ctx.stroke();
    ctx.strokeStyle = 'rgba(255, 246, 224, ' + (0.9 * a) + ')';
    ctx.lineWidth = 5 * a + 1;
    ctx.beginPath(); ctx.moveTo(s.x0, s.y0); ctx.lineTo(s.x1, s.y1); ctx.stroke();
    ctx.lineWidth = 1;
  }
  drawParticles();
  if (fin.t < 900) {
    /* charging rings */
    var pr = (fin.t % 300) / 300;
    ctx.strokeStyle = 'rgba(255, 213, 42, ' + ((1 - pr) * 0.7) + ')';
    ctx.beginPath(); ctx.arc(player.x, player.y - 8, 8 + pr * 26, 0, 6.29); ctx.stroke();
  }
  drawPlayer();
  if (flashT > 0) {
    ctx.fillStyle = 'rgba(255, 255, 255, ' + Math.max(0, flashT / 260) + ')';
    ctx.fillRect(0, 0, W, H);
    flashT -= dt;
  }
}

/* ------------------------------------------------------------------ */
/* defeat -> victory: the face lets go, and real music happens         */
/* ------------------------------------------------------------------ */
function startDefeat() {
  if (stage === 'defeat' || stage === 'victory') return;
  stage = 'defeat';
  defT = 0;
  pShots = []; eShots = []; beams = []; enemies = [];
  if (faceStars) {
    for (var i = 0; i < faceStars.length; i++) {
      var fs = faceStars[i];
      if (!fs.alive || fs.px === undefined) continue;
      fs.alive = false;
      var ang = Math.atan2(fs.py - (H * 0.27 + (boss ? boss.dy : 0)),
                           fs.px - (W / 2 + (boss ? boss.dx : 0))) + (Math.random() - 0.5) * 0.4;
      if (particles.length < 2400)
        particles.push({ x: fs.px, y: fs.py,
                         vx: Math.cos(ang) * (0.08 + Math.random() * 0.25),
                         vy: Math.sin(ang) * (0.08 + Math.random() * 0.25),
                         life: 1600 + Math.random() * 700, max: 2300, col: starColor(fs.l) });
    }
  }
  flashT = 260;
  kick(0.4); noiseHit(0.5, 0.3);
  say('...', true);
}
function victory() {
  stage = 'victory';
  vt = 0;
  document.body.classList.add('warping');
  try { sessionStorage.removeItem('tl_space_cp'); } catch (e) {}
  au.volume = 0.85;
  var p = au.play();
  if (p && p['catch']) p['catch'](function () {
    var note = document.getElementById('musicnote');
    if (note) note.style.display = 'block';
    var once = function () {
      au.play()['catch'](function () {});
      if (note) note.style.display = 'none';
      document.removeEventListener('keydown', once);
      document.removeEventListener('pointerdown', once);
    };
    document.addEventListener('keydown', once);
    document.addEventListener('pointerdown', once);
  });
  setTimeout(function () {
    document.getElementById('outside').classList.add('on');
  }, reduced ? 800 : 2600);
}
var vnotes = [];
function drawVictory(dt) {
  vt += dt;
  var tv = reduced ? 4000 : vt; /* reduced motion: one nice still frame */
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  var cx = W / 2, cy = H * 0.38;
  /* sweeping rainbow rays — every stage light on earth switching back on */
  for (var rI = 0; rI < 7; rI++) {
    var ra = tv * 0.00022 * (rI % 2 ? 1 : -1) + rI * 0.9;
    ctx.fillStyle = 'hsla(' + ((tv * 0.02 + rI * 51) % 360) + ', 85%, 60%, 0.045)';
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, Math.max(W, H), ra, ra + 0.42);
    ctx.closePath(); ctx.fill();
  }
  /* aurora ribbons — the groove, visibly back in the sky */
  for (var a = 0; a < 3; a++) {
    ctx.fillStyle = 'hsla(' + (140 + a * 70 + Math.sin(tv * 0.0004 + a) * 20) + ', 80%, 60%, 0.05)';
    ctx.beginPath();
    ctx.moveTo(0, H);
    for (var x2 = 0; x2 <= W; x2 += 30) {
      ctx.lineTo(x2, H * (0.22 + 0.26 * a) + Math.sin(x2 * 0.004 + tv * 0.0008 + a * 2.1) * H * 0.07);
    }
    ctx.lineTo(W, H);
    ctx.closePath();
    ctx.fill();
  }
  for (var i = 0; i < stars.length; i++) {
    var s = stars[i];
    var alpha = reduced ? 0.6 : 0.3 + 0.7 * Math.abs(Math.sin(s.tw + tv * 0.0008 * s.sp));
    ctx.fillStyle = 'rgba(223, 232, 255, ' + alpha + ')';
    ctx.fillRect(s.x * W, s.y * H, s.r, s.r);
  }
  /* a vinyl record, spinning at a healthy tempo again */
  var R = Math.min(W, H) * 0.17;
  var spin = tv * 0.0035;
  ctx.fillStyle = '#0d0d14';
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, 6.29); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.08)';
  for (var g = R * 0.45; g < R * 0.92; g += 7) {
    ctx.beginPath(); ctx.arc(cx, cy, g, 0, 6.29); ctx.stroke();
  }
  var sheen = ctx.createLinearGradient(cx - R, cy - R, cx + R, cy + R);
  sheen.addColorStop(0, 'hsla(' + ((tv * 0.03) % 360) + ', 90%, 65%, 0.16)');
  sheen.addColorStop(1, 'hsla(' + ((tv * 0.03 + 120) % 360) + ', 90%, 65%, 0.02)');
  ctx.fillStyle = sheen;
  ctx.beginPath(); ctx.arc(cx, cy, R * 0.94, 0, 6.29); ctx.fill();
  ctx.fillStyle = '#ffd52a';
  ctx.beginPath(); ctx.arc(cx, cy, R * 0.34, 0, 6.29); ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(cx, cy, 2.5, 0, 6.29); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.6)';
  ctx.beginPath();
  ctx.moveTo(cx + Math.cos(spin) * R * 0.42, cy + Math.sin(spin) * R * 0.42);
  ctx.lineTo(cx + Math.cos(spin) * R * 0.9, cy + Math.sin(spin) * R * 0.9);
  ctx.stroke();
  /* notes, spiralling out of it in every color the radio forgot */
  if (!reduced && vnotes.length < 40 && Math.random() < 0.25)
    vnotes.push({ a: Math.random() * 6.28, r: R * 0.55, hue: Math.random() * 360,
                  sp: 0.02 + Math.random() * 0.05, vr: 0.02 + Math.random() * 0.04 });
  for (var nI = vnotes.length - 1; nI >= 0; nI--) {
    var vn = vnotes[nI];
    vn.a += vn.sp * dt * 0.06; vn.r += vn.vr * dt; vn.hue += dt * 0.05;
    var fade = Math.max(0, 1 - vn.r / (Math.max(W, H) * 0.6));
    if (fade <= 0) { vnotes.splice(nI, 1); continue; }
    var nx = cx + Math.cos(vn.a) * vn.r, ny = cy + Math.sin(vn.a) * vn.r * 0.8;
    ctx.globalAlpha = fade;
    ctx.fillStyle = 'hsl(' + (vn.hue % 360) + ', 90%, 70%)';
    ctx.fillRect(nx, ny - 7, 2.5, 9);

    ctx.globalAlpha = 1;
  }
  /* an equalizer along the bottom, finally allowed to dance */
  var nBars = 26, bw2 = W / nBars;
  for (var bI = 0; bI < nBars; bI++) {
    var bh = (0.18 + 0.82 * Math.abs(Math.sin(tv * 0.0021 * (0.7 + (bI % 5) * 0.23) + bI * 1.7))) * H * 0.10;
    ctx.fillStyle = 'hsla(' + ((bI * 14 + tv * 0.02) % 360) + ', 85%, 60%, 0.45)';
    ctx.fillRect(bI * bw2 + 2, H - bh, bw2 - 4, bh);
  }

}

/* ------------------------------------------------------------------ */
/* overlays and hud                                                    */
/* ------------------------------------------------------------------ */
function drawBeams() {
  for (var i = 0; i < beams.length; i++) {
    var bm = beams[i];
    if (bm.t <= bm.warn) {
      if (Math.floor(bm.t / 120) % 2) {
        ctx.strokeStyle = 'rgba(255, 90, 90, 0.55)';
        ctx.setLineDash([6, 8]);
        ctx.beginPath(); ctx.moveTo(bm.x, 0); ctx.lineTo(bm.x, H); ctx.stroke();
        ctx.setLineDash([]);
      }
    } else {
      ctx.fillStyle = 'rgba(255, 90, 90, 0.8)';
      ctx.fillRect(bm.x - 9, 0, 18, H);
      ctx.fillStyle = 'rgba(255, 240, 240, 0.9)';
      ctx.fillRect(bm.x - 2, 0, 4, H);
    }
  }
}
function drawHUD() {
  for (var i = 0; i < player.lives; i++) {
    ctx.fillStyle = '#ffd52a';
    ctx.fillRect(16 + i * 12, 16, 3, 16);
    ctx.beginPath(); ctx.arc(17.5 + i * 12, 14, 2.4, 0, 6.29); ctx.fill();
  }
  ctx.font = '11px "Courier New", monospace';
  ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(159, 180, 216, 0.9)';
  if (stage === 'w1' || stage === 'w2' || stage === 'w3')
    ctx.fillText('wave ' + (waveIdx + 1) + ' / 3', W - 16, 26);
  else if (stage === 'boss' || stage === 'bossEnter')
    ctx.fillText('final boss', W - 16, 26);
  ctx.textAlign = 'left';
  if ((stage === 'boss' || stage === 'bossEnter') && boss) {
    var demon = boss.form === 2;
    var bw = Math.min(W * 0.5, 420);
    var bx = (W - bw) / 2, by = 22;
    var f = stage === 'bossEnter' ? Math.min(1, boss.bt / 2000)
          : boss.transT > 0 ? Math.min(1, (2300 - boss.transT) / 2300)
          : boss.hp / (demon ? TUNE.demonHP : TUNE.bossHP);
    ctx.strokeStyle = 'rgba(159, 180, 216, 0.7)';
    ctx.strokeRect(bx, by, bw, 10);
    ctx.fillStyle = demon ? '#ff2a2a' : '#7b2aff';
    ctx.fillRect(bx + 1, by + 1, Math.max(0, (bw - 2) * f), 8);
    ctx.fillStyle = 'rgba(223, 232, 255, 0.85)';
    ctx.font = '10px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.fillText(demon ? 'DEMON SHIZZLE — final round' : 'ozzy shizzle (allegedly)', W / 2, by + 24);
    ctx.textAlign = 'left';
  }
}
function drawAttract() {
  ctx.textAlign = 'center';
  ctx.fillStyle = '#dfe8ff';
  ctx.font = 'bold 30px "Courier New", monospace';
  ctx.fillText('GROOVE SPACE', W / 2, H * 0.3);
  ctx.font = '13px "Courier New", monospace';
  ctx.fillStyle = 'rgba(159, 180, 216, 0.95)';
  ctx.fillText('ozzy shizzle is at the end of this nebula.', W / 2, H * 0.3 + 34);
  ctx.fillText('every groove on earth is with him. all radio is 60 bpm country now.', W / 2, H * 0.3 + 54);
  ctx.fillStyle = 'rgba(159, 180, 216, 0.8)';
  ctx.fillText('← → or a·d — move · space or touch — fire · esc — pause', W / 2, H * 0.3 + 92);
  if (cp !== 'w1')
    ctx.fillText('(resuming at ' + (cp === 'boss' ? 'the final boss' : 'wave ' + cp.charAt(1)) + ')', W / 2, H * 0.3 + 116);
  if (reduced || Math.floor(gt / 600) % 2) {
    ctx.font = 'bold 14px "Courier New", monospace';
    ctx.fillStyle = '#fff';
    ctx.fillText('press anything', W / 2, H * 0.62);
  }
  ctx.textAlign = 'left';

function drawDead() {
  ctx.fillStyle = 'rgba(2, 2, 10, 0.72)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ff8a8a';
  ctx.font = 'bold 20px "Courier New", monospace';
  ctx.fillText('out of lives.', W / 2, H * 0.42);
  ctx.font = '13px "Courier New", monospace';
  ctx.fillStyle = 'rgba(223, 232, 255, 0.9)';
  ctx.fillText('"he laughs in perfect 4/4."', W / 2, H * 0.42 + 30);
  if (reduced || Math.floor(gt / 600) % 2) {
    ctx.fillStyle = '#fff';
    ctx.fillText('press anything. again.', W / 2, H * 0.42 + 66);
  }
  ctx.textAlign = 'left';
}
function drawPaused() {
  ctx.fillStyle = 'rgba(2, 2, 10, 0.6)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#dfe8ff';
  ctx.font = 'bold 16px "Courier New", monospace';
  ctx.fillText('paused. the universe waits.', W / 2, H * 0.45);

/* ------------------------------------------------------------------ */
/* stage control                                                       */
/* ------------------------------------------------------------------ */
var WAVE_TAUNTS = [
  '"those were rentals." — ozzy shizzle',
  '"you are ruining a very organized nebula." — ozzy shizzle',
  '"FINE. come and meet the face." — ozzy shizzle'
];
var cp = 'w1';
try { cp = sessionStorage.getItem('tl_space_cp') || 'w1'; } catch (e) {}
if (['w1', 'w2', 'w3', 'boss'].indexOf(cp) === -1) cp = 'w1';
function saveCp(s) {
  cp = s;
  try { sessionStorage.setItem('tl_space_cp', s); } catch (e) {}
}
function startStage(s) {
  pShots = []; eShots = []; beams = []; particles = []; enemies = [];
  player.x = W / 2; player.y = H - 74; player.inv = 900; player.cool = 0;
  pending = null;
  beatT = 0;
  if (s === 'w1' || s === 'w2' || s === 'w3') {
    stage = s;
    waveIdx = +s.charAt(1) - 1;
    saveCp(s);
    boss = null;
    title.textContent = 'the groove nebula';
    spawnWave(waveIdx);
    say(stageDefault(), true);
  } else {
    stage = 'bossEnter';
    waveIdx = 2;
    saveCp('boss');
    startBoss();
  }
}
function updatePlayer(dt) {
  player.y = H - 74;
  var v = TUNE.playerSpeed * dt;
  if (pointerOn) {
    var d = pointerX - player.x;
    player.x += Math.max(-v, Math.min(v, d));
  } else {
    if (keys.left) player.x -= v;
    if (keys.right) player.x += v;
  }
  player.x = Math.max(16, Math.min(W - 16, player.x));
  if (player.inv > 0) player.inv -= dt;
  player.cool -= dt;
  if ((keys.fire || pointerOn) && player.cool <= 0 && pShots.length < 8) {
    pShots.push({ x: player.x, y: player.y - 24 });
    player.cool = TUNE.fireCooldown;
    blip(880, 0.04, 'square', 0.04);
  }
}
function update(dt) {
  gt += dt;
  if (pending && stage !== 'dead') {
    pending.t -= dt;
    if (pending.t <= 0) { var s = pending.s; pending = null; startStage(s); }
  }
  if (stage === 'attract' || stage === 'dead') return;
  if (stage === 'finish') { fin.t += dt; runFinish(dt); updateParticles(dt); return; }
  if (stage === 'defeat') { defT += dt; updateParticles(dt); if (defT > 2300) victory(); return; }
  if (stage === 'victory') { updateParticles(dt); return; }
  updatePlayer(dt);
  updateShots(dt);
  updateParticles(dt);
  if (stage === 'w1' || stage === 'w2' || stage === 'w3') {
    updateEnemies(dt);
    beat(dt);
    collideWave();
    checkPlayerHits();
    if (!enemies.length && !pending && stage !== 'dead') {
      say(WAVE_TAUNTS[waveIdx], true);
      pending = { s: waveIdx >= 2 ? 'boss' : 'w' + (waveIdx + 2), t: 1900 };
    }
  } else if (stage === 'bossEnter') {
    boss.bt += dt;
    if (reduced || boss.bt > 2100) {
      stage = 'boss';
      say(stageDefault(), true);
    }
  } else if (stage === 'boss') {
    updateBoss(dt);
    if (stage !== 'boss') return; /* the last hit may have landed mid-update */
    beat(dt);
    collideBoss();
    checkPlayerHits();
  }
}
function draw(dt) {
  if (stage === 'victory') { drawVictory(dt); return; }
  if (stage === 'finish') { drawFinish(dt); return; }
  drawBackdrop();
  if (stage === 'attract') { drawAttract(); return; }
  if (stage === 'defeat') {
    drawParticles();
    if (flashT > 0) {
      ctx.fillStyle = 'rgba(255, 255, 255, ' + Math.max(0, flashT / 260) + ')';
      ctx.fillRect(0, 0, W, H);
      flashT -= dt;
    }
    return;
  }
  if ((stage === 'bossEnter' || stage === 'boss') && faceStars) drawBoss();
  drawBeams();
  for (var i = 0; i < enemies.length; i++) {
    var e = enemies[i];
    if (e.kind === 'metro') drawMetro(e);
    else if (e.kind === 'note') drawNote(e);
    else drawRest(e);
  }
  drawShots();
  drawParticles();
  drawPlayer();
  drawHUD();
  if (stage === 'dead') drawDead();
  if (paused) drawPaused();
  if (flashT > 0) {
    /* the demon reveal washes the sky red */
    ctx.fillStyle = 'rgba(255, 60, 40, ' + (Math.max(0, flashT / 300) * 0.55) + ')';
    ctx.fillRect(0, 0, W, H);
    flashT -= dt;
  }
}

/* ------------------------------------------------------------------ */
/* the prize — priming real audio inside a user gesture                */
/* ------------------------------------------------------------------ */
var au = document.getElementById('treefingers');
var primed = false;
function primeAudio() {
  if (primed) return;
  primed = true;
  au.volume = 0;
  var p = au.play();
  if (p && p.then) {
    p.then(function () { au.pause(); au.currentTime = 0; au.volume = 0.85; })
     ['catch'](function () { au.volume = 0.85; });
  } else {
    try { au.pause(); } catch (e2) {}
    au.volume = 0.85;
  }
}
function proceed() {
  audio();
  primeAudio();
  player.lives = TUNE.lives;
  startStage(cp === 'boss' ? 'boss' : cp);
}

/* input                                                               */

var PREVENT = { ' ': 1, ArrowLeft: 1, ArrowRight: 1, ArrowUp: 1, ArrowDown: 1 };
document.addEventListener('keydown', function (e) {
  if (PREVENT[e.key]) e.preventDefault();
  if (stage === 'attract' || stage === 'dead') { if (!e.repeat) proceed(); return; }
  if (stage === 'defeat' || stage === 'victory' || stage === 'finish') return;
  if (paused) { paused = false; return; }
  if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') { paused = true; return; }
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
  if (e.key === ' ' || e.key === 'Enter') keys.fire = true;
});
document.addEventListener('keyup', function (e) {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
  if (e.key === ' ' || e.key === 'Enter') keys.fire = false;
});
canvas.addEventListener('touchstart', function (e) { e.preventDefault(); }, { passive: false });
canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });
canvas.addEventListener('pointerdown', function (e) {
  e.preventDefault();
  if (stage === 'attract' || stage === 'dead') { proceed(); return; }
  if (paused) { paused = false; return; }
  try { canvas.setPointerCapture(e.pointerId); } catch (e2) {}
  pointerOn = true;
  pointerX = e.clientX;
});
canvas.addEventListener('pointermove', function (e) {
  if (pointerOn) pointerX = e.clientX;
});
window.addEventListener('pointerup', function () { pointerOn = false; });
window.addEventListener('pointercancel', function () { pointerOn = false; });
function autoPause() {
  if (stage === 'w1' || stage === 'w2' || stage === 'w3' ||
      stage === 'boss' || stage === 'bossEnter') paused = true;
}
window.addEventListener('blur', autoPause);
document.addEventListener('visibilitychange', function () { if (document.hidden) autoPause(); });

/* ------------------------------------------------------------------ */
/* main loop                                                           */
/* ------------------------------------------------------------------ */
var lastTs = 0;
function loop(ts) {
  var dt = lastTs ? Math.min(ts - lastTs, 50) : 16.7;
  lastTs = ts;
  if (paused) dt = 0;
  update(dt);
  draw(dt);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* debug/test handle */
window.__space = {
  state: function () {
    return { stage: stage, lives: player.lives, wave: waveIdx + 1,
             hp: boss ? boss.hp : null, form: boss ? boss.form : null,
             transT: boss ? boss.transT : null, enemies: enemies.length,
             eShots: eShots.length, pShots: pShots.length,
             firing: keys.fire, pointer: pointerOn, paused: paused, cp: cp };
  },
  skipTo: function (s) {
    player.lives = TUNE.lives;
    startStage(s === 'boss' ? 'boss' : s);
  },
  god: function (v) { god = v !== false; return god; },
  bossRef: function () { return boss; },
  win: function () {
    if (!faceStars) decodeFace();
    if (!boss) boss = { hp: 1, phase: 3, form: 2, bt: 9999, dx: 0, dy: 0, spiralA: 0,
                        spiralT: 0, radT: 0, beamT: 0, transT: 0, laughT: 9999,
                        laughAnim: 0, horns: true };
    boss.form = 2;
    boss.transT = 0;
    for (var i = 0; i < faceStars.length; i++) {
      var fs = faceStars[i];
      if (fs.alive === undefined || fs.px === undefined) {
        fs.alive = true;
        var tp = bossTarget(fs);
        fs.px = tp[0]; fs.py = tp[1];
      }
    }
    boss.hp = 0;
    startFinish();
  },
  tune: TUNE
};
})();
</script>
</body>
