<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THE DUNGEON — Oscar Yarbrough</title>
<meta name="description" content="Door no.1. An 8-bit dungeon. Bump into things.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="/_shared/img/favicon-32.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #0a0a12; min-height: 100vh; }
  body {
    color: #cfc7e8;
    font-family: "Courier New", Courier, monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 1.2rem 1rem 2.5rem;
  }
  h1 {
    font-size: 0.95rem;
    letter-spacing: 0.35em;
    color: #ffd52a;
    margin: 0.4rem 0 1rem;
    text-transform: uppercase;
  }
  .stage {
    position: relative;
    line-height: 0;
    border: 4px solid #2a2a3a;
    box-shadow: 0 0 40px rgba(123, 42, 255, 0.25);
  }
  canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    display: block;
  }
  /* message bar — crisp DOM text over the canvas, because 7px canvas type
     upscaled 3-4x was unreadable (round-19) */
  .msg {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    z-index: 2;
    display: none;
    background: rgba(2, 2, 8, 0.88);
    border-top: 1px solid #3a3a52;
    color: #fff;
    font: bold 0.82rem/1.45 "Courier New", Courier, monospace;
    letter-spacing: 0.03em;
    padding: 0.4em 0.65em;
    pointer-events: none;
  }
  /* CRT scanlines */
  .stage::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom, rgba(0,0,0,0) 0, rgba(0,0,0,0) 2px, rgba(0,0,0,0.18) 3px);
  }
  .hint {
    margin-top: 0.9rem;
    font-size: 0.72rem;
    color: #6f6790;
    text-align: center;
    line-height: 1.7;
  }
  .pad {
    display: none;
    margin-top: 1rem;
    grid-template-columns: repeat(3, 56px);
    grid-template-rows: repeat(2, 56px);
    gap: 6px;
  }
  @media (pointer: coarse) { .pad { display: grid; } }
  .pad button {
    font: bold 1.2rem "Courier New", monospace;
    background: #1c1c2c;
    color: #cfc7e8;
    border: 2px solid #3a3a52;
    border-radius: 8px;
    touch-action: manipulation;
  }
  .pad button:active { background: #3a3a52; }
  .pad .u { grid-column: 2; grid-row: 1; }
  .pad .l { grid-column: 1; grid-row: 2; }
  .pad .d { grid-column: 2; grid-row: 2; }
  .pad .r { grid-column: 3; grid-row: 2; }
  .exits { margin-top: 1.6rem; font-size: 0.75rem; line-height: 2.2; }
  .exits a { color: #ffd52a; }
  .exits a:hover { background: #ffd52a; color: #0a0a12; text-decoration: none; }
</style>
</head>
<body>

<h1>The Dungeon</h1>

<div class="stage"><canvas id="game" width="240" height="160"></canvas><div class="msg" id="msgbar" role="status"></div></div>

<p class="hint">arrow keys / wasd to walk. bump into things — pots break, drums slap, walls lie.<br>
somebody scratched a code into a wall down here.</p>

<div class="pad" aria-hidden="true">
  <button class="u" data-dir="up">▲</button>
  <button class="l" data-dir="left">◀</button>
  <button class="d" data-dir="down">▼</button>
  <button class="r" data-dir="right">▶</button>
</div>

<p class="exits">
  → <a href="/secret">crawl back through the portal</a><br>
  → <a href="/">give up on dungeons, return to the website</a>
</p>

<script>
(function () {
'use strict';

var canvas = document.getElementById('game');
var msgbar = document.getElementById('msgbar');
var ctx = canvas.getContext('2d');
var TILE = 16, MW = 15, MH = 10;

/* fit: integer-scale the 240x160 buffer to the window */
function fit() {
  var s = Math.max(1, Math.floor(Math.min(
    (window.innerWidth - 40) / 240, (window.innerHeight - 220) / 160)));
  canvas.style.width = (240 * s) + 'px';
  canvas.style.height = (160 * s) + 'px';
}
window.addEventListener('resize', fit);
fit();

/* ------------------------------------------------------------------ */
/* maps — 15 x 10 chars. # wall, . floor, T torch, D door, P pot,     */
/* C chest, R drum, S sign, G graffiti, K cracked wall, M monument,   */
/* X passage back, E exit                                             */
/* ------------------------------------------------------------------ */
var MAPS = {
  hall: [
    '##T####D###T###',
    '#.............#',
    '#..P......P...#',
    '#.....R.......#',
    '#.............#',
    '#.............K',
    '#..P......C...#',
    '#.............#',
    '#..S..........#',
    '###############'
  ],
  nook: [
    '###############',
    '###############',
    '###.......#####',
    '###.S..G..#####',
    '###.......#####',
    'X..........####',
    '###.......#####',
    '###############',
    '###############',
    '###############'
  ],
  sanctum: [
    '###############',
    '##T.........T##',
    '##...........##',
    '##.....M.....##',
    '##...........##',
    '##.....S.....##',
    '##...........##',
    '##T.........T##',
    '#######E#######',
    '###############'
  ]
};

var state = {
  room: 'hall',
  px: 7, py: 7,           // player tile
  ox: 0, oy: 0,           // pixel offset while sliding
  dir: 'down',
  moving: null,
  hasKey: false, hasStick: false,
  doorOpen: false, chestOpen: false, crackHits: 0, crackOpen: false,
  broken: {},             // 'x,y' => true for smashed pots
  groove: false,
  trackOn: false,
  msg: '', msgUntil: 0,
  t: 0
};

function tileAt(x, y) {
  if (x < 0 || y < 0 || x >= MW || y >= MH) return '#';
  var ch = MAPS[state.room][y].charAt(x);
  if (ch === 'P' && state.broken[state.room + x + ',' + y]) return '.';
  if (ch === 'D' && state.doorOpen) return '.';
  if (ch === 'K' && state.crackOpen) return '.';
  return ch;
}
function solid(ch) { return '#TPDCRSGKM'.indexOf(ch) !== -1; }

function say(text, ms) { state.msg = text; state.msgUntil = state.t + (ms || 220); }

/* ------------------------------------------------------------------ */
/* audio — everything synthesized, nothing loaded                      */
/* ------------------------------------------------------------------ */
var ac = null;
function audio() {
  if (!ac) {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ac = new AC();
  }
  if (ac.state === 'suspended') ac.resume();
  return ac;
}
function blip(freq, dur, type, vol) {
  var a = audio(); if (!a) return;
  var o = a.createOscillator(), g = a.createGain();
  o.type = type || 'square';
  o.frequency.value = freq;
  g.gain.setValueAtTime(vol || 0.08, a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + dur);
  o.connect(g).connect(a.destination);
  o.start(); o.stop(a.currentTime + dur);
}
function noiseHit(dur, vol) {
  var a = audio(); if (!a) return;
  var n = a.createBufferSource();
  var buf = a.createBuffer(1, a.sampleRate * dur, a.sampleRate);
  var d = buf.getChannelData(0);
  for (var i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
  n.buffer = buf;
  var g = a.createGain();
  g.gain.value = vol || 0.15;
  n.connect(g).connect(a.destination);
  n.start();
}
function kick() {
  var a = audio(); if (!a) return;
  var o = a.createOscillator(), g = a.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(120, a.currentTime);
  o.frequency.exponentialRampToValueAtTime(40, a.currentTime + 0.12);
  g.gain.setValueAtTime(0.35, a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + 0.14);
  o.connect(g).connect(a.destination);
  o.start(); o.stop(a.currentTime + 0.15);
}
function drumFill() {
  kick();
  setTimeout(function () { noiseHit(0.06, 0.12); }, 130);
  setTimeout(kick, 260);
  setTimeout(function () { noiseHit(0.06, 0.12); }, 330);
  setTimeout(function () { noiseHit(0.18, 0.2); }, 460);
}
var trackTimer = null;
function secretTrack(on) {
  if (trackTimer) { clearInterval(trackTimer); trackTimer = null; }
  if (!on) return;
  var step = 0;
  trackTimer = setInterval(function () {
    var s = step % 8;
    if (s === 0 || s === 5) kick();
    if (s === 2 || s === 6) noiseHit(0.05, 0.1);
    noiseHit(0.015, 0.03);
    if (s === 7) blip([220, 262, 330, 392][Math.floor(step / 8) % 4], 0.1, 'triangle', 0.06);
    step++;
  }, 140);
}

/* ------------------------------------------------------------------ */
/* bump handlers                                                       */
/* ------------------------------------------------------------------ */
var lastBump = 0;
function bump(x, y, ch) {
  if (state.t - lastBump < 14) return;
  lastBump = state.t;
  var id = state.room + x + ',' + y;

  if (ch === 'P') {
    state.broken[id] = true;
    noiseHit(0.1, 0.2);
    if (state.room === 'hall' && x === 3 && y === 2 && !state.hasKey) {
      state.hasKey = true;
      blip(660, 0.1); setTimeout(function(){ blip(880, 0.12); }, 90);
      say('under the shards: a small brass KEY.');
    } else {
      say(['nothing but dust.', 'a spider waves back.', 'shards. regret.'][Math.floor(Math.random() * 3)]);
    }
  } else if (ch === 'C') {
    if (state.chestOpen) { say('the chest is empty now. like all chests, eventually.'); return; }
    if (!state.hasKey) { say('locked tight. maybe check the pottery. it is load-bearing pottery.'); blip(110, 0.1); return; }
    state.chestOpen = true; state.hasStick = true;
    blip(523, 0.09); setTimeout(function(){ blip(659, 0.09); }, 80);
    setTimeout(function(){ blip(784, 0.09); }, 160); setTimeout(function(){ blip(1047, 0.2); }, 240);
    say('the GOLDEN DRUMSTICK! +3 groove. the north door hums.');
  } else if (ch === 'D') {
    if (!state.hasStick) { say('locked. the keyhole is... drumstick-shaped?'); blip(110, 0.1); return; }
    state.doorOpen = true;
    blip(196, 0.2, 'triangle', 0.12);
    say('the golden drumstick fits. obviously.');
  } else if (ch === 'R') {
    drumFill();
    say('the drum of the ancients. it still slaps.');
  } else if (ch === 'S') {
    if (state.room === 'hall') say('"welcome to the dungeon. mind the pots." — the management');
    else if (state.room === 'nook') say('"TODO: hide something better in here." — the management');
    else say('"you made it. i keep the extra weird ideas down here. take one, leave one." — oscar');
  } else if (ch === 'G') {
    say('"^ ^ v v < > < > B A" is scratched into the stone.');
  } else if (ch === 'K') {
    state.crackHits++;
    noiseHit(0.05, 0.1);
    if (state.crackHits === 1) say('the wall sounds hollow here.');
    else if (state.crackHits === 2) say('something shifted.');
    else { state.crackOpen = true; noiseHit(0.3, 0.25); say('the wall crumbles. a passage!'); }
  } else if (ch === 'M') {
    state.trackOn = !state.trackOn;
    secretTrack(state.trackOn);
    say(state.trackOn ? 'the monument plays the SECRET TRACK. it is mostly drums.'
                      : 'the monument falls silent.');
  } else if (ch === 'T') {
    say('a torch. warm. flammable. best left alone.');
  }
}

/* room transitions when stepping onto special open tiles */
function stepped(x, y) {
  var ch = MAPS[state.room][y].charAt(x);
  if (state.room === 'hall' && ch === 'D' && state.doorOpen) {
    state.room = 'sanctum'; state.px = 7; state.py = 7; state.dir = 'up';
    say('the inner sanctum.');
  } else if (state.room === 'hall' && ch === 'K' && state.crackOpen) {
    state.room = 'nook'; state.px = 1; state.py = 5; state.dir = 'right';
    say('a secret nook. it smells like secrets. and dust.');
  } else if (state.room === 'nook' && ch === 'X') {
    state.room = 'hall'; state.px = 13; state.py = 5; state.dir = 'left';
  } else if (state.room === 'sanctum' && ch === 'E') {
    state.room = 'hall'; state.px = 7; state.py = 1; state.dir = 'down';
  }
}

/* ------------------------------------------------------------------ */
/* input                                                               */
/* ------------------------------------------------------------------ */
var held = {};
var DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
var KEYMAP = {
  ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
  w: 'up', s: 'down', a: 'left', d: 'right',
  W: 'up', S: 'down', A: 'left', D: 'right'
};
var KONAMI = ['up','up','down','down','left','right','left','right','b','a'];
var kbuf = [];
function konamiFeed(token) {
  kbuf.push(token);
  if (kbuf.length > KONAMI.length) kbuf.shift();
  if (kbuf.join(',') === KONAMI.join(',')) {
    state.groove = !state.groove;
    canvas.style.filter = state.groove ? '' : 'none';
    drumFill();
    say(state.groove ? 'GROOVE MODE. it is raining drumsticks.' : 'groove mode off. the rain stops.');
  }
}
document.addEventListener('keydown', function (e) {
  var d = KEYMAP[e.key];
  var low = e.key.length === 1 ? e.key.toLowerCase() : '';
  if (d) { e.preventDefault(); held[d] = true; audio(); if (!e.repeat) startStep(d, true); }
  // the scratched code listens to the ARROW keys only, plus b and a —
  // otherwise wasd's a collides with konami's a and the code can never land
  if (e.key.indexOf('Arrow') === 0) konamiFeed(d);
  else if (low === 'b' || low === 'a') konamiFeed(low);
});
document.addEventListener('keyup', function (e) {
  var d = KEYMAP[e.key];
  if (d) held[d] = false;
});
Array.prototype.forEach.call(document.querySelectorAll('.pad button'), function (b) {
  var d = b.getAttribute('data-dir');
  b.addEventListener('pointerdown', function (e) { e.preventDefault(); held[d] = true; konamiFeed(d); audio(); startStep(d, true); });
  b.addEventListener('pointerup', function () { held[d] = false; });
  b.addEventListener('pointercancel', function () { held[d] = false; });
  b.addEventListener('pointerleave', function () { held[d] = false; });
});

/* one step in direction d. Fresh keydown taps queue if a slide is       */
/* underway (so quick taps never vanish); the per-frame held-key poll    */
/* NEVER queues, or taps would double-step.                              */
function startStep(d, queueIfBusy) {
  if (state.moving) { if (queueIfBusy) state.queued = d; return; }
  state.dir = d;
  var nx = state.px + DIRS[d][0], ny = state.py + DIRS[d][1];
  var ch = tileAt(nx, ny);
  if (solid(ch)) { bump(nx, ny, MAPS[state.room][ny] ? MAPS[state.room][ny].charAt(nx) : '#'); return; }
  state.moving = { nx: nx, ny: ny, d: d, p: 0 };
}
function tryMove() {
  if (state.moving) return;
  for (var k in DIRS) if (held[k]) { startStep(k, false); return; }
}

/* ------------------------------------------------------------------ */
/* drawing                                                             */
/* ------------------------------------------------------------------ */
var head = new Image();
head.src = '/_shared/img/head.png';

var sticks = []; // groove-mode drumstick rain
function drawTile(ch, x, y) {
  var px = x * TILE, py = y * TILE;
  if (ch === '#') {
    ctx.fillStyle = '#2a2a3a'; ctx.fillRect(px, py, TILE, TILE);
    ctx.fillStyle = '#3c3c52';
    ctx.fillRect(px + 1, py + 1, 6, 6); ctx.fillRect(px + 9, py + 1, 6, 6);
    ctx.fillRect(px + 1, py + 9, 14, 6);
  } else {
    ctx.fillStyle = ((x + y) % 2) ? '#3a3244' : '#423a4e';
    ctx.fillRect(px, py, TILE, TILE);
  }
  if (ch === 'T') {
    ctx.fillStyle = '#8a5a2a'; ctx.fillRect(px + 7, py + 8, 2, 6);
    var f = Math.floor(state.t / 8) % 2;
    ctx.fillStyle = '#ff9b2a'; ctx.fillRect(px + 6, py + 4 - f, 4, 4 + f);
    ctx.fillStyle = '#ffd52a'; ctx.fillRect(px + 7, py + 5, 2, 2);
  } else if (ch === 'P') {
    ctx.fillStyle = '#b5651d';
    ctx.fillRect(px + 4, py + 6, 8, 8);
    ctx.fillRect(px + 3, py + 8, 10, 4);
    ctx.fillStyle = '#8a4a12'; ctx.fillRect(px + 5, py + 4, 6, 2);
  } else if (ch === 'C') {
    ctx.fillStyle = '#8a5a2a'; ctx.fillRect(px + 2, py + 5, 12, 9);
    ctx.fillStyle = state.chestOpen ? '#2a2a3a' : '#5a3a16';
    ctx.fillRect(px + 2, py + 5, 12, 4);
    ctx.fillStyle = '#ffd52a'; ctx.fillRect(px + 7, py + 8, 2, 3);
  } else if (ch === 'D') {
    if (state.doorOpen) { ctx.fillStyle = '#000'; ctx.fillRect(px + 2, py, 12, TILE); }
    else {
      ctx.fillStyle = '#5a3a16'; ctx.fillRect(px + 2, py + 1, 12, 15);
      ctx.fillStyle = '#8a5a2a'; ctx.fillRect(px + 4, py + 3, 8, 13);
      ctx.fillStyle = '#ffd52a'; ctx.fillRect(px + 10, py + 8, 2, 2);
    }
  } else if (ch === 'R') {
    ctx.fillStyle = '#c23a3a'; ctx.fillRect(px + 3, py + 6, 10, 8);
    ctx.fillStyle = '#e8ddc8'; ctx.fillRect(px + 3, py + 4, 10, 3);
    ctx.fillStyle = '#8a2a2a'; ctx.fillRect(px + 3, py + 10, 10, 1);
  } else if (ch === 'S' || ch === 'G') {
    ctx.fillStyle = '#8a5a2a'; ctx.fillRect(px + 7, py + 9, 2, 5);
    ctx.fillStyle = '#c8b088'; ctx.fillRect(px + 3, py + 3, 10, 7);
    ctx.fillStyle = '#5a3a16';
    ctx.fillRect(px + 4, py + 5, 8, 1); ctx.fillRect(px + 4, py + 7, 6, 1);
  } else if (ch === 'K') {
    if (state.crackOpen) { ctx.fillStyle = '#000'; ctx.fillRect(px, py + 2, TILE, 12); }
    else {
      ctx.fillStyle = '#2a2a3a'; ctx.fillRect(px, py, TILE, TILE);
      ctx.fillStyle = '#14141e';
      ctx.fillRect(px + 7, py + 2, 1, 4); ctx.fillRect(px + 6, py + 5, 1, 3);
      ctx.fillRect(px + 8, py + 7, 1, 4); ctx.fillRect(px + 7, py + 10, 1, 4);
    }
  } else if (ch === 'M') {
    ctx.fillStyle = '#5a5a6e'; ctx.fillRect(px + 3, py + 8, 10, 7);
    ctx.fillStyle = '#7b7b94'; ctx.fillRect(px + 5, py + 2, 6, 7);
    if (state.trackOn) {
      ctx.fillStyle = ['#ff2a2a', '#ffd52a', '#2ad9ff'][Math.floor(state.t / 6) % 3];
      ctx.fillRect(px + 6, py - 2, 4, 2);
    }
  } else if (ch === 'X' || ch === 'E') {
    ctx.fillStyle = '#000'; ctx.fillRect(px + 2, py + 2, 12, 12);
  }
}

function drawPlayer() {
  var px = state.px * TILE + state.ox, py = state.py * TILE + state.oy;
  var bob = state.moving ? (Math.floor(state.t / 4) % 2) : 0;
  ctx.fillStyle = '#3a2a1a'; ctx.fillRect(px + 4, py + 1, 8, 4);         // hair
  ctx.fillStyle = '#f0c8a0'; ctx.fillRect(px + 4, py + 4, 8, 5);         // face
  ctx.fillStyle = '#1b1917';
  if (state.dir !== 'up') {
    if (state.dir !== 'right') ctx.fillRect(px + 5, py + 6, 2, 2);       // eyes
    if (state.dir !== 'left') ctx.fillRect(px + 9, py + 6, 2, 2);
  }
  ctx.fillStyle = '#c23a3a'; ctx.fillRect(px + 3, py + 9, 10, 5);        // shirt
  ctx.fillStyle = '#2a2a52'; ctx.fillRect(px + 4, py + 14 - bob, 3, 2 + bob); // legs
  ctx.fillRect(px + 9, py + 14 - (1 - bob), 3, 2 + (1 - bob));
  if (state.hasStick) { ctx.fillStyle = '#ffd52a'; ctx.fillRect(px + 13, py + 8, 2, 7); }
}

function draw() {
  ctx.fillStyle = '#0a0a12';
  ctx.fillRect(0, 0, 240, 160);

  var map = MAPS[state.room];
  for (var y = 0; y < MH; y++)
    for (var x = 0; x < MW; x++) {
      var ch = map[y].charAt(x);
      if (ch === 'P' && state.broken[state.room + x + ',' + y]) ch = '.';
      drawTile(ch, x, y);
    }

  /* smashed pots leave shards */
  for (var key in state.broken) {
    if (key.indexOf(state.room) === 0) {
      var xy = key.slice(state.room.length).split(',');
      var sx = xy[0] * TILE, sy = xy[1] * TILE;
      ctx.fillStyle = '#b5651d';
      ctx.fillRect(sx + 4, sy + 11, 3, 2); ctx.fillRect(sx + 9, sy + 12, 3, 2);
      ctx.fillRect(sx + 7, sy + 9, 2, 2);
    }
  }

  /* the sanctum's big pixel head on the back wall */
  if (state.room === 'sanctum' && head.complete && head.naturalWidth) {
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(head, 104, -2, 32, 39);
  }

  drawPlayer();

  /* groove mode: raining drumsticks */
  if (state.groove) {
    if (sticks.length < 40 && Math.random() < 0.4)
      sticks.push({ x: Math.random() * 240, y: -8, r: Math.random() * 6.28, v: 1 + Math.random() * 1.5 });
    ctx.fillStyle = '#ffd52a';
    for (var i = sticks.length - 1; i >= 0; i--) {
      var st = sticks[i];
      st.y += st.v; st.r += 0.2;
      ctx.save();
      ctx.translate(st.x, st.y); ctx.rotate(st.r);
      ctx.fillRect(-4, -1, 8, 2);
      ctx.restore();
      if (st.y > 170) sticks.splice(i, 1);
    }
  } else if (sticks.length) sticks.length = 0;

  /* HUD: inventory icons top-right */
  if (state.hasKey && !state.chestOpen) {
    ctx.fillStyle = '#ffd52a';
    ctx.fillRect(222, 4, 6, 6); ctx.fillStyle = '#0a0a12'; ctx.fillRect(224, 6, 2, 2);
    ctx.fillStyle = '#ffd52a'; ctx.fillRect(224, 10, 2, 6); ctx.fillRect(226, 13, 2, 2);
  }
  if (state.hasStick) { ctx.fillStyle = '#ffd52a'; ctx.fillRect(212, 4, 3, 12); }

  /* message bar — real DOM text so it stays readable at any scale */
  if (state.t < state.msgUntil && state.msg) {
    if (msgbar.textContent !== state.msg) msgbar.textContent = state.msg;
    if (msgbar.style.display !== 'block') msgbar.style.display = 'block';
  } else if (msgbar.style.display === 'block') {
    msgbar.style.display = 'none';
  }

  if (state.groove) {
    canvas.style.filter = 'hue-rotate(' + ((state.t * 4) % 360) + 'deg)';
  } else if (canvas.style.filter) canvas.style.filter = '';
}

/* ------------------------------------------------------------------ */
/* main loop                                                           */
/* ------------------------------------------------------------------ */
say('the dungeon. mind the pots.', 300);
window.__dungeon = state; // debug/test handle
function loop() {
  state.t++;
  if (state.moving) {
    state.moving.p += 0.18;
    var m = state.moving;
    if (m.p >= 1) {
      state.px = m.nx; state.py = m.ny; state.ox = 0; state.oy = 0;
      state.moving = null;
      stepped(state.px, state.py);
      if (state.queued) { var q = state.queued; state.queued = null; startStep(q, false); }
    } else {
      state.ox = DIRS[m.d][0] * m.p * TILE;
      state.oy = DIRS[m.d][1] * m.p * TILE;
    }
  } else tryMove();
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
