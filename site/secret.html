<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GRAND THEFT GROOVE</title>
<meta name="description" content="Ozzy Shizzle stole the groove. The dungeon knows.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="/_shared/img/favicon-32.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #0a0a12; min-height: 100vh; }
  body {
    color: #cfc7e8;
    font-family: "Courier New", Courier, monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 1.2rem 1rem 2.5rem;
    /* it's a game — never let iOS long-press select or magnify the page */
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
  }
  h1 {
    font-size: 0.95rem;
    letter-spacing: 0.35em;
    color: #ffd52a;
    margin: 0.4rem 0 0.3rem;
    text-transform: uppercase;
  }
  .tagline {
    font-size: 0.72rem;
    color: #6f6790;
    margin-bottom: 1rem;
    text-align: center;
  }
  .stage {
    position: relative;
    line-height: 0;
    border: 4px solid #2a2a3a;
    box-shadow: 0 0 40px rgba(123, 42, 255, 0.25);
  }
  canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    display: block;
  }
  /* message bar — crisp DOM text over the canvas, because 7px canvas type
     upscaled 3-4x was unreadable */
  .msg {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    z-index: 2;
    display: none;
    background: rgba(2, 2, 8, 0.88);
    border-top: 1px solid #3a3a52;
    color: #fff;
    font: bold 0.82rem/1.45 "Courier New", Courier, monospace;
    letter-spacing: 0.03em;
    padding: 0.4em 0.65em;
    pointer-events: none;
  }
  /* touch screens: the overlay ate half the little playfield — the text
     lives BELOW the dungeon instead, a steady strip above the controls.
     FIXED footprint: if this strip ever grows or shrinks with the text,
     the whole page jumps while walking (the iOS "popping bar"). wider
     than the stage + a hard height = the same three lines of room, always. */
  .touchui .msg {
    position: static;
    display: block;
    width: 88vw;
    max-width: 34rem;
    margin-left: 50%;
    transform: translateX(-50%);
    height: 5.2em;
    overflow: hidden;
    font-size: 0.72rem;
    text-align: center;
  }
  /* intro cutscene caption + hint (crisp DOM text, canvas draws the pictures) */
  #cutbar {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    z-index: 3;
    display: none;
    background: rgba(2, 2, 8, 0.92);
    border-top: 1px solid #3a3a52;
    color: #fff;
    font: bold 0.82rem/1.45 "Courier New", Courier, monospace;
    letter-spacing: 0.03em;
    text-align: center;
    padding: 0.45em 0.65em;
  }
  #cuthint {
    position: absolute;
    right: 6px; top: 4px;
    z-index: 3;
    display: none;
    color: #6f6790;
    font: 0.62rem/1.3 "Courier New", Courier, monospace;
    letter-spacing: 0.05em;
  }
  /* CRT scanlines */
  .stage::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom, rgba(0,0,0,0) 0, rgba(0,0,0,0) 2px, rgba(0,0,0,0.18) 3px);
  }
  .hint {
    margin-top: 0.9rem;
    font-size: 0.72rem;
    color: #6f6790;
    text-align: center;
    line-height: 1.7;
  }
  .hint a { color: #6f6790; }
  .hint a:hover { background: #6f6790; color: #0a0a12; text-decoration: none; }
  .pad {
    display: none;
    margin-top: 1rem;
    grid-template-columns: repeat(3, 56px);
    grid-template-rows: repeat(2, 56px);
    gap: 6px;
  }
  @media (pointer: coarse) { .pad { display: grid; } }
  .touchui .pad { display: grid; }
  .pad button {
    font: bold 1.2rem "Courier New", monospace;
    background: #1c1c2c;
    color: #cfc7e8;
    border: 2px solid #3a3a52;
    border-radius: 8px;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  .pad button:active { background: #3a3a52; }
  .pad .u { grid-column: 2; grid-row: 1; }
  .pad .l { grid-column: 1; grid-row: 2; }
  .pad .d { grid-column: 2; grid-row: 2; }
  .pad .r { grid-column: 3; grid-row: 2; }
  .exits { margin-top: 1.6rem; font-size: 0.75rem; line-height: 2.2; }
  .exits a { color: #ffd52a; }
  .exits a:hover { background: #ffd52a; color: #0a0a12; text-decoration: none; }
  .exits .label { color: #6f6790; }

  /* the floppy takes you: the screen collapses to a line, then a dot */
  #tvoff {
    position: fixed; inset: 0; background: #000; display: none; z-index: 999;
  }
  #tvoff.on { display: block; }
  #tvoff .beam {
    position: absolute; left: 0; right: 0; top: 50%; height: 3px;
    background: #fff; box-shadow: 0 0 30px 8px rgba(255,255,255,0.85);
    transform-origin: center;
    animation: tvoff 1.25s ease-in forwards;
  }
  @keyframes tvoff {
    0%   { transform: translateY(-50%) scaleX(1) scaleY(220); opacity: 1; }
    55%  { transform: translateY(-50%) scaleX(1) scaleY(1); opacity: 1; }
    88%  { transform: translateY(-50%) scaleX(0.02) scaleY(1); opacity: 1; }
    100% { transform: translateY(-50%) scaleX(0.001) scaleY(0.4); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) { #tvoff .beam { animation: none; opacity: 0; } }
</style>
</head>
<body>

<h1>GRAND THEFT GROOVE</h1>

<div class="stage"><canvas id="game" width="240" height="160"></canvas><div class="msg" id="msgbar" role="status"></div><div id="cutbar" aria-hidden="true"></div><div id="cuthint" aria-hidden="true">tap / any key: next &middot; esc: skip</div></div>

<p class="hint">arrow keys / wasd to walk. &nbsp;&middot;&nbsp; <a href="#" id="musictoggle"></a></p>

<div class="pad" aria-hidden="true">
  <button class="u" data-dir="up">▲</button>
  <button class="l" data-dir="left">◀</button>
  <button class="d" data-dir="down">▼</button>
  <button class="r" data-dir="right">▶</button>
</div>

<p class="exits">
  → <a href="/">wake up</a> <span class="label">(back to the normal website)</span>
</p>

<div id="tvoff" aria-hidden="true"><div class="beam"></div></div>

<script>
(function () {
'use strict';

var canvas = document.getElementById('game');
var msgbar = document.getElementById('msgbar');
var cutbar = document.getElementById('cutbar');
var cuthint = document.getElementById('cuthint');
var ctx = canvas.getContext('2d');
var TILE = 16, MW = 15, MH = 10;
var REDUCED = window.matchMedia &&
  window.matchMedia('(prefers-reduced-motion: reduce)').matches;
/* ?touch=1 forces the phone layout so it can be tested in desktop Chrome,
   where (pointer: coarse) never matches */
var TOUCHUI = (window.matchMedia &&
  window.matchMedia('(pointer: coarse)').matches) ||
  /[?&]touch=1/.test(location.search);
if (TOUCHUI) document.body.classList.add('touchui');

/* walking pace — ms per tile, and how long a held key waits before it
   auto-repeats (delta-time based, so 120hz screens don't walk 2x fast) */
var MS_PER_TILE = 140, REPEAT_FIRST = 150, REPEAT_NEXT = 40;

/* fit: integer-scale the 240x160 buffer to the window */
function fit() {
  var s = Math.max(1, Math.floor(Math.min(
    (window.innerWidth - 40) / 240, (window.innerHeight - 220) / 160)));
  canvas.style.width = (240 * s) + 'px';
  canvas.style.height = (160 * s) + 'px';
}
window.addEventListener('resize', fit);
fit();

/* ------------------------------------------------------------------ */
/* maps — 15 x 10 chars. # wall, . floor, T torch, D door, P pot,     */
/* C chest, R drum, S sign, G graffiti, K cracked wall, M monument,   */
/* X passage back, E exit                                             */
/* ------------------------------------------------------------------ */
var MAPS = {
  hall: [
    '##T####D###T###',
    '#.............#',
    '#..P......P...#',
    '#.....R.......#',
    '#.............#',
    '#.............K',
    '#..P......C...#',
    '#.............#',
    '#..S..........#',
    '###############'
  ],
  nook: [
    '###############',
    '###############',
    '###.......#####',
    '###.S..G..#####',
    '###.......#####',
    'X..........####',
    '###.......#####',
    '###############',
    '###############',
    '###############'
  ],
  sanctum: [
    '###############',
    '##T.........T##',
    '##...........##',
    '##.....M.....##',
    '##...........##',
    '##.....S.....##',
    '##...........##',
    '##T.........T##',
    '#######E#######',
    '###############'
  ]
};

var state = {
  room: 'hall',
  px: 7, py: 7,           // player tile
  ox: 0, oy: 0,           // pixel offset while sliding
  dir: 'down',
  moving: null,
  hasKey: false, hasStick: false,
  doorOpen: false, chestOpen: false, crackHits: 0, crackOpen: false,
  floppyOut: false,
  broken: {},             // 'x,y' => true for smashed pots
  groove: false,
  trackOn: false,
  booting: false,
  msg: '', msgUntil: 0,
  phase: 'intro',         // 'intro' (cutscene) or 'play'
  iCard: 0, iT: 0,        // cutscene card index + ms into it
  stepReadyAt: 0,         // ms timestamp when a held key may auto-step again
  autoRep: false,         // currently in a held-key auto-repeat chain
  t: 0
};

function tileAt(x, y) {
  if (x < 0 || y < 0 || x >= MW || y >= MH) return '#';
  var ch = MAPS[state.room][y].charAt(x);
  if (ch === 'P' && state.broken[state.room + x + ',' + y]) return '.';
  if (ch === 'D' && state.doorOpen) return '.';
  if (ch === 'K' && state.crackOpen) return '.';
  return ch;
}
function solid(ch) { return '#TPDCRSGKM'.indexOf(ch) !== -1; }

function say(text, ms) { state.msg = text; state.msgUntil = state.t + (ms || 220); }

/* ------------------------------------------------------------------ */
/* audio — everything synthesized, nothing loaded                      */
/* ------------------------------------------------------------------ */
var ac = null;
function audio() {
  if (!ac) {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ac = new AC();
  }
  if (ac.state === 'suspended') ac.resume();
  return ac;
}
function blip(freq, dur, type, vol) {
  var a = audio(); if (!a) return;
  var o = a.createOscillator(), g = a.createGain();
  o.type = type || 'square';
  o.frequency.value = freq;
  g.gain.setValueAtTime(vol || 0.08, a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + dur);
  o.connect(g).connect(a.destination);
  o.start(); o.stop(a.currentTime + dur);
}
function noiseHit(dur, vol) {
  var a = audio(); if (!a) return;
  var n = a.createBufferSource();
  var buf = a.createBuffer(1, a.sampleRate * dur, a.sampleRate);
  var d = buf.getChannelData(0);
  for (var i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
  n.buffer = buf;
  var g = a.createGain();
  g.gain.value = vol || 0.15;
  n.connect(g).connect(a.destination);
  n.start();
}
function kick() {
  var a = audio(); if (!a) return;
  var o = a.createOscillator(), g = a.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(120, a.currentTime);
  o.frequency.exponentialRampToValueAtTime(40, a.currentTime + 0.12);
  g.gain.setValueAtTime(0.35, a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + 0.14);
  o.connect(g).connect(a.destination);
  o.start(); o.stop(a.currentTime + 0.15);
}
function drumFill() {
  kick();
  setTimeout(function () { noiseHit(0.06, 0.12); }, 130);
  setTimeout(kick, 260);
  setTimeout(function () { noiseHit(0.06, 0.12); }, 330);
  setTimeout(function () { noiseHit(0.18, 0.2); }, 460);
}
/* background music — an original dungeon-crawl chiptune loop, composed
   right here in code (oscillators only, no recordings, nothing to
   license). silent until the first tap/keypress unlocks the context. */
var MUSIC_OFF = false;
try { MUSIC_OFF = sessionStorage.getItem('gtg_music_off') === '1'; } catch (e) {}
var DNG_MEL = { 2: 440, 6: 523.25, 10: 440, 14: 392,
                18: 349.23, 22: 440, 26: 329.63, 34: 440,
                38: 523.25, 40: 659.25, 46: 587.33, 50: 523.25,
                54: 440, 62: 415.3 };
var bgm = { timer: null, step: 0, name: '' };
function bgmStop() {
  if (bgm.timer) { clearInterval(bgm.timer); bgm.timer = null; }
  bgm.name = '';
}
function bgmPlay(name) {
  if (bgm.name === name) return;
  bgmStop();
  bgm.name = name;
  bgm.step = 0;
  bgm.timer = setInterval(function () {
    if (MUSIC_OFF) return;
    var a = audio();
    if (!a || a.state !== 'running') return;
    var s = bgm.step % 64;
    var bar = Math.floor(s / 16), b = s % 16;
    var root = [110, 110, 87.31, 98][bar];        /* A · A · F · G */
    if (b === 0 || b === 10) blip(root, 0.55, 'triangle', 0.05);
    if (b === 4) blip(root * 1.5, 0.3, 'triangle', 0.03);
    if (b === 8) noiseHit(0.02, 0.02);
    if (DNG_MEL[s]) blip(DNG_MEL[s], 0.2, 'square', 0.018);
    bgm.step++;
  }, 150);
}
var trackTimer = null;
function secretTrack(on) {
  if (trackTimer) { clearInterval(trackTimer); trackTimer = null; }
  if (!on) return;
  var step = 0;
  trackTimer = setInterval(function () {
    var s = step % 8;
    if (s === 0 || s === 5) kick();
    if (s === 2 || s === 6) noiseHit(0.05, 0.1);
    noiseHit(0.015, 0.03);
    if (s === 7) blip([220, 262, 330, 392][Math.floor(step / 8) % 4], 0.1, 'triangle', 0.06);
    step++;
  }, 140);
}

/* stepping on the floppy: the room switches off like an old TV */
function collapseToOS() {
  if (state.booting) return;
  state.booting = true;
  say('the floppy hums. ozzy shizzle\'s laugh echoes from inside it. the room folds in.', 999);
  blip(880, 0.1, 'square', 0.08);
  setTimeout(function () { blip(440, 0.12, 'square', 0.08); }, 150);
  setTimeout(function () { blip(110, 0.4, 'sine', 0.12); }, 320);
  var reduced = window.matchMedia &&
    window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.getElementById('tvoff').classList.add('on');
  setTimeout(function () { location.href = 'secret-2.html'; }, reduced ? 300 : 1500);
}

/* ------------------------------------------------------------------ */
/* bump handlers                                                       */
/* ------------------------------------------------------------------ */
var lastBump = 0;
function bump(x, y, ch) {
  if (state.t - lastBump < 14) return;
  lastBump = state.t;
  var id = state.room + x + ',' + y;

  if (ch === 'P') {
    state.broken[id] = true;
    noiseHit(0.1, 0.2);
    if (state.room === 'hall' && x === 3 && y === 2 && !state.hasKey) {
      state.hasKey = true;
      blip(660, 0.1); setTimeout(function(){ blip(880, 0.12); }, 90);
      say('under the shards: a small brass KEY.');
    } else {
      say(['nothing but dust.', 'a spider waves back.', 'shards. regret.'][Math.floor(Math.random() * 3)]);
    }
  } else if (ch === 'C') {
    if (state.chestOpen) { say('the chest is empty now. like all chests, eventually.'); return; }
    if (!state.hasKey) { say('locked tight. maybe check the pottery. it is load-bearing pottery.'); blip(110, 0.1); return; }
    state.chestOpen = true; state.hasStick = true;
    blip(523, 0.09); setTimeout(function(){ blip(659, 0.09); }, 80);
    setTimeout(function(){ blip(784, 0.09); }, 160); setTimeout(function(){ blip(1047, 0.2); }, 240);
    say('the GOLDEN DRUMSTICK! +3 groove. the north door hums.');
  } else if (ch === 'D') {
    if (!state.hasStick) { say('locked. the keyhole is... drumstick-shaped?'); blip(110, 0.1); return; }
    state.doorOpen = true;
    blip(196, 0.2, 'triangle', 0.12);
    say('the golden drumstick fits. obviously.');
  } else if (ch === 'R') {
    drumFill();
    say('the drum of the ancients. it still slaps.');
  } else if (ch === 'S') {
    if (state.room === 'hall') say('"welcome to MY dungeon. do not touch MY pots." — ozzy shizzle');
    else if (state.room === 'nook') say('"TODO: hide something better down here." — ozzy shizzle');
    else say('"feed the monument its song and it will spit out the way forward. it will not help you catch me." — ozzy shizzle');
  } else if (ch === 'G') {
    say('"^ ^ v v < > < > B A" is scratched into the stone.');
  } else if (ch === 'K') {
    state.crackHits++;
    noiseHit(0.05, 0.1);
    if (state.crackHits === 1) say('the wall sounds hollow here.');
    else if (state.crackHits === 2) say('something shifted.');
    else { state.crackOpen = true; noiseHit(0.3, 0.25); say('the wall crumbles. a passage!'); }
  } else if (ch === 'M') {
    if (!state.trackOn) {
      state.trackOn = true;
      bgmStop(); /* the monument's SECRET TRACK takes the stage alone */
      secretTrack(true);
      state.floppyOut = true;
      blip(660, 0.12); setTimeout(function(){ blip(880, 0.16); }, 110);
      say('the monument plays the SECRET TRACK — and clatters. a glowing floppy disk pops out at its feet.');
    } else {
      say('the monument is busy playing drums. the floppy is waiting below it.');
    }
  } else if (ch === 'T') {
    say('a torch. warm. flammable. best left alone.');
  }
}

/* room transitions when stepping onto special open tiles */
function stepped(x, y) {
  var ch = MAPS[state.room][y].charAt(x);
  if (state.room === 'hall' && ch === 'D' && state.doorOpen) {
    state.room = 'sanctum'; state.px = 7; state.py = 6; state.dir = 'up';
    say('the inner sanctum. the monument looks hungry for a song.');
  } else if (state.room === 'hall' && ch === 'K' && state.crackOpen) {
    state.room = 'nook'; state.px = 1; state.py = 5; state.dir = 'right';
    say('a secret nook. it smells like secrets. and dust.');
  } else if (state.room === 'nook' && ch === 'X') {
    state.room = 'hall'; state.px = 13; state.py = 5; state.dir = 'left';
  } else if (state.room === 'sanctum' && state.floppyOut && x === 7 && y === 4) {
    collapseToOS();
  } else if (state.room === 'sanctum' && ch === 'E') {
    state.room = 'hall'; state.px = 7; state.py = 1; state.dir = 'down';
  }
}

/* ------------------------------------------------------------------ */
/* input                                                               */
/* ------------------------------------------------------------------ */
var held = {};
var DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
var KEYMAP = {
  ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
  w: 'up', s: 'down', a: 'left', d: 'right',
  W: 'up', S: 'down', A: 'left', D: 'right'
};
var KONAMI = ['up','up','down','down','left','right','left','right','b','a'];
var kbuf = [];
function konamiFeed(token) {
  kbuf.push(token);
  if (kbuf.length > KONAMI.length) kbuf.shift();
  if (kbuf.join(',') === KONAMI.join(',')) {
    state.groove = !state.groove;
    canvas.style.filter = state.groove ? '' : 'none';
    drumFill();
    say(state.groove ? 'GROOVE MODE. it is raining drumsticks.' : 'groove mode off. the rain stops.');
  }
}
document.addEventListener('keydown', function (e) {
  if (state.phase === 'intro') {
    if (e.key === 'Escape') { e.preventDefault(); endIntro(); return; }
    if (KEYMAP[e.key] || e.key === ' ' || e.key === 'Enter') e.preventDefault();
    if (!e.repeat) { audio(); advanceIntro(); }
    return;
  }
  var d = KEYMAP[e.key];
  var low = e.key.length === 1 ? e.key.toLowerCase() : '';
  if (d) { e.preventDefault(); held[d] = true; audio(); if (!e.repeat) { state.autoRep = false; startStep(d, true); } }
  // the scratched code listens to the ARROW keys only, plus b and a —
  // otherwise wasd's a collides with konami's a and the code can never land
  if (e.key.indexOf('Arrow') === 0) konamiFeed(d);
  else if (low === 'b' || low === 'a') konamiFeed(low);
});
document.addEventListener('keyup', function (e) {
  var d = KEYMAP[e.key];
  if (d) held[d] = false;
});
/* iOS: a held arrow button must never start text selection, show the
   magnifier loupe, or pop the long-press menu. pointerdown alone can't
   stop those — the touchstart default and contextmenu have to go too. */
var padEl = document.querySelector('.pad');
if (padEl) {
  padEl.addEventListener('touchstart', function (e) { e.preventDefault(); }, { passive: false });
  padEl.addEventListener('contextmenu', function (e) { e.preventDefault(); });
}
Array.prototype.forEach.call(document.querySelectorAll('.pad button'), function (b) {
  var d = b.getAttribute('data-dir');
  b.addEventListener('pointerdown', function (e) { e.preventDefault(); if (state.phase === 'intro') { audio(); advanceIntro(); return; } held[d] = true; konamiFeed(d); audio(); state.autoRep = false; startStep(d, true); });
  b.addEventListener('pointerup', function () { held[d] = false; });
  b.addEventListener('pointercancel', function () { held[d] = false; });
  b.addEventListener('pointerleave', function () { held[d] = false; });
});

/* one step in direction d. Fresh keydown taps queue if a slide is       */
/* underway (so quick taps never vanish); the per-frame held-key poll    */
/* NEVER queues, or taps would double-step.                              */
function startStep(d, queueIfBusy) {
  if (state.moving) { if (queueIfBusy) state.queued = d; return; }
  state.dir = d;
  var nx = state.px + DIRS[d][0], ny = state.py + DIRS[d][1];
  var ch = tileAt(nx, ny);
  if (solid(ch)) { bump(nx, ny, MAPS[state.room][ny] ? MAPS[state.room][ny].charAt(nx) : '#'); return; }
  state.moving = { nx: nx, ny: ny, d: d, p: 0 };
}
/* held-key auto-walk, gated by a small cooldown after each finished step
   so holding an arrow strolls instead of sprinting. fresh taps and the
   tap-queue skip the gate entirely. */
function tryMove(ts) {
  if (state.moving) return;
  for (var k in DIRS) if (held[k]) {
    if (ts < state.stepReadyAt) return;
    state.autoRep = true;
    startStep(k, false);
    return;
  }
  state.autoRep = false;
}

var head = new Image();
head.src = '/_shared/img/head.png';

var sticks = []; // groove-mode drumstick rain
function drawTile(ch, x, y) {
  var px = x * TILE, py = y * TILE;
  if (ch === '#') {
    ctx.fillStyle = '#2a2a3a'; ctx.fillRect(px, py, TILE, TILE);
    ctx.fillStyle = '#3c3c52';
    ctx.fillRect(px + 1, py + 1, 6, 6); ctx.fillRect(px + 9, py + 1, 6, 6);
    ctx.fillRect(px + 1, py + 9, 14, 6);
  } else {
    ctx.fillStyle = ((x + y) % 2) ? '#3a3244' : '#423a4e';
    ctx.fillRect(px, py, TILE, TILE);
  }
  if (ch === 'T') {
    ctx.fillStyle = '#8a5a2a'; ctx.fillRect(px + 7, py + 8, 2, 6);
    var f = Math.floor(state.t / 8) % 2;
    ctx.fillStyle = '#ff9b2a'; ctx.fillRect(px + 6, py + 4 - f, 4, 4 + f);
    ctx.fillStyle = '#ffd52a'; ctx.fillRect(px + 7, py + 5, 2, 2);
  } else if (ch === 'P') {
    ctx.fillStyle = '#b5651d';
    ctx.fillRect(px + 4, py + 6, 8, 8);
    ctx.fillRect(px + 3, py + 8, 10, 4);
    ctx.fillStyle = '#8a4a12'; ctx.fillRect(px + 5, py + 4, 6, 2);
  } else if (ch === 'C') {
    ctx.fillStyle = '#8a5a2a'; ctx.fillRect(px + 2, py + 5, 12, 9);
    ctx.fillStyle = state.chestOpen ? '#2a2a3a' : '#5a3a16';
    ctx.fillRect(px + 2, py + 5, 12, 4);
    ctx.fillStyle = '#ffd52a'; ctx.fillRect(px + 7, py + 8, 2, 3);
  } else if (ch === 'D') {
    if (state.doorOpen) { ctx.fillStyle = '#000'; ctx.fillRect(px + 2, py, 12, TILE); }
    else {
      ctx.fillStyle = '#5a3a16'; ctx.fillRect(px + 2, py + 1, 12, 15);
      ctx.fillStyle = '#8a5a2a'; ctx.fillRect(px + 4, py + 3, 8, 13);
      ctx.fillStyle = '#ffd52a'; ctx.fillRect(px + 10, py + 8, 2, 2);
    }
  } else if (ch === 'R') {
    ctx.fillStyle = '#c23a3a'; ctx.fillRect(px + 3, py + 6, 10, 8);
    ctx.fillStyle = '#e8ddc8'; ctx.fillRect(px + 3, py + 4, 10, 3);
    ctx.fillStyle = '#8a2a2a'; ctx.fillRect(px + 3, py + 10, 10, 1);
  } else if (ch === 'S' || ch === 'G') {
    ctx.fillStyle = '#8a5a2a'; ctx.fillRect(px + 7, py + 9, 2, 5);
    ctx.fillStyle = '#c8b088'; ctx.fillRect(px + 3, py + 3, 10, 7);
    ctx.fillStyle = '#5a3a16';
    ctx.fillRect(px + 4, py + 5, 8, 1); ctx.fillRect(px + 4, py + 7, 6, 1);
  } else if (ch === 'K') {
    if (state.crackOpen) { ctx.fillStyle = '#000'; ctx.fillRect(px, py + 2, TILE, 12); }
    else {
      ctx.fillStyle = '#2a2a3a'; ctx.fillRect(px, py, TILE, TILE);
      ctx.fillStyle = '#14141e';
      ctx.fillRect(px + 7, py + 2, 1, 4); ctx.fillRect(px + 6, py + 5, 1, 3);
      ctx.fillRect(px + 8, py + 7, 1, 4); ctx.fillRect(px + 7, py + 10, 1, 4);
    }
  } else if (ch === 'M') {
    ctx.fillStyle = '#5a5a6e'; ctx.fillRect(px + 3, py + 8, 10, 7);
    ctx.fillStyle = '#7b7b94'; ctx.fillRect(px + 5, py + 2, 6, 7);
    if (state.trackOn) {
      ctx.fillStyle = ['#ff2a2a', '#ffd52a', '#2ad9ff'][Math.floor(state.t / 6) % 3];
      ctx.fillRect(px + 6, py - 2, 4, 2);
    }
  } else if (ch === 'O') {
    /* the machine: a beige box with a screen that never gave up */
    ctx.fillStyle = '#b8ab90'; ctx.fillRect(px + 2, py + 3, 12, 11);
    ctx.fillStyle = '#1a221a'; ctx.fillRect(px + 4, py + 5, 8, 6);
    var on = Math.floor(state.t / 20) % 2;
    ctx.fillStyle = on ? '#33ff33' : '#1f8f1f';
    ctx.fillRect(px + 5, py + 6, 2, 1);
    ctx.fillRect(px + 5, py + 8, on ? 4 : 2, 1);
    ctx.fillStyle = '#8a8070'; ctx.fillRect(px + 2, py + 14, 12, 1);
  } else if (ch === 'X' || ch === 'E') {
    ctx.fillStyle = '#000'; ctx.fillRect(px + 2, py + 2, 12, 12);
  }
}

function drawPlayer() {
  var px = state.px * TILE + state.ox, py = state.py * TILE + state.oy;
  var bob = state.moving ? (Math.floor(state.t / 4) % 2) : 0;
  ctx.fillStyle = '#3a2a1a'; ctx.fillRect(px + 4, py + 1, 8, 4);         // hair
  ctx.fillStyle = '#f0c8a0'; ctx.fillRect(px + 4, py + 4, 8, 5);         // face
  ctx.fillStyle = '#1b1917';
  if (state.dir !== 'up') {
    if (state.dir !== 'right') ctx.fillRect(px + 5, py + 6, 2, 2);       // eyes
    if (state.dir !== 'left') ctx.fillRect(px + 9, py + 6, 2, 2);
  }
  ctx.fillStyle = '#c23a3a'; ctx.fillRect(px + 3, py + 9, 10, 5);        // shirt
  ctx.fillStyle = '#2a2a52'; ctx.fillRect(px + 4, py + 14 - bob, 3, 2 + bob); // legs
  ctx.fillRect(px + 9, py + 14 - (1 - bob), 3, 2 + (1 - bob));
  if (state.hasStick) { ctx.fillStyle = '#ffd52a'; ctx.fillRect(px + 13, py + 8, 2, 7); }
}

function draw() {
  ctx.fillStyle = '#0a0a12';
  ctx.fillRect(0, 0, 240, 160);

  var map = MAPS[state.room];
  for (var y = 0; y < MH; y++)
    for (var x = 0; x < MW; x++) {
      var ch = map[y].charAt(x);
      if (ch === 'P' && state.broken[state.room + x + ',' + y]) ch = '.';
      drawTile(ch, x, y);
    }

  /* smashed pots leave shards */
  for (var key in state.broken) {
    if (key.indexOf(state.room) === 0) {
      var xy = key.slice(state.room.length).split(',');
      var sx = xy[0] * TILE, sy = xy[1] * TILE;
      ctx.fillStyle = '#b5651d';
      ctx.fillRect(sx + 4, sy + 11, 3, 2); ctx.fillRect(sx + 9, sy + 12, 3, 2);
      ctx.fillRect(sx + 7, sy + 9, 2, 2);
    }
  }

  /* the ejected floppy, glowing at the monument's feet */
  if (state.room === 'sanctum' && state.floppyOut) {
    var flx = 7 * TILE, fly = 4 * TILE;
    var gl = Math.floor(state.t / 10) % 2;
    ctx.fillStyle = gl ? '#2a6bff' : '#2ad9ff';
    ctx.fillRect(flx + 3, fly + 4, 10, 9);
    ctx.fillStyle = '#e8e8f0'; ctx.fillRect(flx + 5, fly + 4, 6, 3);
    ctx.fillStyle = '#0a0a12'; ctx.fillRect(flx + 8, fly + 4, 2, 2);
    ctx.fillStyle = '#e8e8f0'; ctx.fillRect(flx + 5, fly + 9, 6, 3);
  }

  drawPlayer();

  /* groove mode: raining drumsticks */
  if (state.groove) {
    if (sticks.length < 40 && Math.random() < 0.4)
      sticks.push({ x: Math.random() * 240, y: -8, r: Math.random() * 6.28, v: 1 + Math.random() * 1.5 });
    ctx.fillStyle = '#ffd52a';
    for (var i = sticks.length - 1; i >= 0; i--) {
      var st = sticks[i];
      st.y += st.v; st.r += 0.2;
      ctx.save();
      ctx.translate(st.x, st.y); ctx.rotate(st.r);
      ctx.fillRect(-4, -1, 8, 2);
      ctx.restore();
      if (st.y > 170) sticks.splice(i, 1);
    }
  } else if (sticks.length) sticks.length = 0;

  /* HUD: inventory icons top-right */
  if (state.hasKey && !state.chestOpen) {
    ctx.fillStyle = '#ffd52a';
    ctx.fillRect(222, 4, 6, 6); ctx.fillStyle = '#0a0a12'; ctx.fillRect(224, 6, 2, 2);
    ctx.fillStyle = '#ffd52a'; ctx.fillRect(224, 10, 2, 6); ctx.fillRect(226, 13, 2, 2);
  }
  if (state.hasStick) { ctx.fillStyle = '#ffd52a'; ctx.fillRect(212, 4, 3, 12); }

  /* message bar — real DOM text so it stays readable at any scale.
     touch UI keeps the strip in the layout (empty when quiet) so the
     arrow pad never jumps around under a thumb. */
  if (state.t < state.msgUntil && state.msg) {
    if (msgbar.textContent !== state.msg) msgbar.textContent = state.msg;
    if (!TOUCHUI && msgbar.style.display !== 'block') msgbar.style.display = 'block';
  } else if (TOUCHUI) {
    if (msgbar.textContent) msgbar.textContent = '';
  } else if (msgbar.style.display === 'block') {
    msgbar.style.display = 'none';
  }

  if (state.groove) {
    canvas.style.filter = 'hue-rotate(' + ((state.t * 4) % 360) + 'deg)';
  } else if (canvas.style.filter) canvas.style.filter = '';
}

function introSprite(px, py, tie) {
  ctx.fillStyle = '#3a2a1a'; ctx.fillRect(px + 4, py + 1, 8, 4);

function drawIntro() {
  ctx.fillStyle = '#050509';
  ctx.fillRect(0, 0, 240, 160);
  var c = state.iCard;
  var t = REDUCED ? [4800, 900, 0, 0, 900, 400, 0][c] : state.iT;
  var i, w;
  if (c === 0) {
    /* oscar yarbrough: tie, lawn, sunshine, one well-watered flower */
    ctx.fillStyle = '#ffd52a';
    ctx.beginPath(); ctx.arc(36, 28, 11, 0, 6.29); ctx.fill();
    for (i = 0; i < 8; i++) {
      var sa = i / 8 * 6.283 + t * 0.0004;
      ctx.fillRect(36 + Math.cos(sa) * 17 - 1, 28 + Math.sin(sa) * 17 - 1, 3, 3);
    }
    ctx.fillStyle = '#e8e8f0';                                   /* picket fence */
    for (i = 0; i < 12; i++) ctx.fillRect(6 + i * 21, 82, 4, 15);
    ctx.fillRect(0, 87, 240, 3);
    ctx.fillStyle = '#1f3a1f'; ctx.fillRect(0, 97, 240, 63);     /* lawn */
    ctx.fillStyle = '#2a5a2a';
    for (i = 0; i < 14; i++) ctx.fillRect(9 + i * 17, 100 + (i % 4) * 9, 2, 4);
    introSprite(112, 81, true);
    ctx.fillStyle = '#2a8a2a'; ctx.fillRect(152, 101, 2, 11);    /* the flower */
    ctx.fillStyle = '#ff6bd8'; ctx.fillRect(149, 95, 8, 8);
    ctx.fillStyle = '#ffd52a'; ctx.fillRect(152, 98, 2, 2);
  } else if (c === 1) {
    /* night. bats. ozzy osbourne, in silhouette, radiating bad influence. */
    var lt = t % 1600;
    if (lt < 140 && !REDUCED) {
      ctx.fillStyle = 'rgba(200, 190, 255, 0.16)';
      ctx.fillRect(0, 0, 240, 160);
      ctx.strokeStyle = '#e8e8ff';
      ctx.beginPath();
      ctx.moveTo(34, 0); ctx.lineTo(48, 26); ctx.lineTo(38, 30); ctx.lineTo(56, 62);
      ctx.stroke();
    }
    ctx.fillStyle = '#c9c4b4';                                   /* thin moon */
    ctx.beginPath(); ctx.arc(206, 24, 10, 0, 6.29); ctx.fill();
    ctx.fillStyle = '#050509';
    ctx.beginPath(); ctx.arc(210, 21, 8, 0, 6.29); ctx.fill();
    var ox = 128, oy = 44;
    ctx.fillStyle = '#14141e'; ctx.fillRect(ox, oy + 26, 48, 70); /* long coat */
    ctx.fillStyle = '#0d0d16'; ctx.fillRect(ox + 6, oy - 2, 36, 44); /* the hair. all of it. */
    ctx.fillStyle = '#2a2438'; ctx.fillRect(ox + 12, oy + 6, 24, 20);
    ctx.strokeStyle = '#b06bff';                                  /* round glasses */
    ctx.beginPath(); ctx.arc(ox + 18, oy + 14, 4.5, 0, 6.29); ctx.stroke();
    ctx.beginPath(); ctx.arc(ox + 30, oy + 14, 4.5, 0, 6.29); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ox + 22, oy + 14); ctx.lineTo(ox + 26, oy + 14); ctx.stroke();
    ctx.fillStyle = '#c9c4b4';                                    /* cross pendant */
    ctx.fillRect(ox + 22, oy + 34, 3, 12); ctx.fillRect(ox + 18, oy + 37, 11, 3);
    for (i = 0; i < 3; i++) {                                     /* bats */
      var bx = 26 + i * 40 + Math.sin(t * 0.002 + i * 2) * 12;
      var by = 24 + i * 10 + Math.sin(t * 0.003 + i * 4) * 9;
      var flap = Math.floor(t / 160 + i) % 2;
      ctx.fillStyle = '#3a2a52';
      ctx.fillRect(bx - 5, by - flap * 2, 4, 2);
      ctx.fillRect(bx + 2, by - flap * 2, 4, 2);
      ctx.fillRect(bx - 1, by, 3, 3);
    }
    introSprite(40, 96, true);                                    /* oscar, receiving the visit */
  } else if (c === 2) {
    /* the paperwork */
    ctx.fillStyle = '#e8ddc8'; ctx.fillRect(50, 24, 140, 108);
    ctx.strokeStyle = '#8a6a3a'; ctx.strokeRect(56, 30, 128, 96);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#3a2a1a';
    ctx.font = 'bold 9px monospace';
    ctx.fillText('CERTIFICATE OF', 120, 46);
    ctx.fillText('NAME CHANGE', 120, 57);
    ctx.font = '8px monospace';
    ctx.fillStyle = '#6a5a4a';
    ctx.fillText('oscar yarbrough', 120, 74);
    ctx.strokeStyle = '#c23a3a';
    ctx.beginPath(); ctx.moveTo(82, 71); ctx.lineTo(158, 71); ctx.stroke();
    ctx.fillStyle = '#3a2a1a';                                    /* a chunky arrow down */
    ctx.fillRect(119, 79, 3, 8);
    ctx.beginPath(); ctx.moveTo(115, 87); ctx.lineTo(126, 87); ctx.lineTo(120.5, 93); ctx.closePath(); ctx.fill();
    ctx.font = 'bold 10px monospace';
    ctx.fillStyle = '#7b2aff';
    ctx.fillText('OZZY SHIZZLE', 120, 106);
    ctx.fillStyle = '#c23a3a';                                    /* the wax seal, very official */
    ctx.beginPath(); ctx.arc(162, 116, 8, 0, 6.29); ctx.fill();
    ctx.fillStyle = '#8a1a1a';
    ctx.beginPath(); ctx.arc(162, 116, 5, 0, 6.29); ctx.fill();
    ctx.textAlign = 'left';
  } else if (c === 3) {
    /* the poster of the real ozzy. unattainable. */
    ctx.fillStyle = '#14141e'; ctx.fillRect(140, 28, 72, 94);
    ctx.strokeStyle = '#ffd52a'; ctx.strokeRect(143, 31, 66, 88);
    ctx.fillStyle = '#ffd52a';
    ctx.beginPath();
    for (i = 0; i < 10; i++) {
      var ra = (i % 2 ? 7 : 16);
      var aa2 = -1.5708 + i * 0.6283;
      var vx = 176 + Math.cos(aa2) * ra, vy = 60 + Math.sin(aa2) * ra;
      if (i === 0) ctx.moveTo(vx, vy); else ctx.lineTo(vx, vy);
    }
    ctx.closePath(); ctx.fill();
    ctx.textAlign = 'center';
    ctx.font = 'bold 9px monospace';
    ctx.fillText('OZZY', 176, 96);
    ctx.fillText('OSBOURNE', 176, 108);
    if (!REDUCED && Math.floor(t / 400) % 2) {                    /* poster sparkle */
      ctx.fillStyle = '#fff';
      ctx.fillRect(150, 40, 2, 6); ctx.fillRect(148, 42, 6, 2);
    }
    ctx.textAlign = 'left';
    if (head.complete && head.naturalWidth) {                     /* shizzle, gazing up, deflated */
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(head, 52, 58, 32, 39);
    }
    ctx.fillStyle = '#7bd0ff';                                    /* one tear */
    ctx.fillRect(60, 98 + ((t * 0.02) % 14), 2, 4);
  } else if (c === 4) {
    /* the crime scene: a metronome at 60, in a mandatory cowboy hat */
    var ph = (t % 2000) / 2000;
    var tri = ph < 0.5 ? ph * 4 - 1 : 3 - ph * 4;
    var ang2 = tri * 0.52;
    var cx2 = 120;
    ctx.fillStyle = '#3a2a1a';
    for (i = 0; i < 52; i++) {
      w = 20 + i * 0.66;
      ctx.fillRect(cx2 - w / 2, 66 + i, w, 1);
    }
    ctx.fillStyle = '#241a10'; ctx.fillRect(cx2 - 13, 78, 26, 32);

    if (beat !== introBeat) { introBeat = beat; if (ac) blip(1500, 0.03, 'square', 0.05); }
    ctx.strokeStyle = '#e8e8f0'; ctx.lineWidth = 2;
    ctx.beginPath();

    ctx.lineTo(cx2 + Math.sin(ang2) * 46, 114 - Math.cos(ang2) * 46);
    ctx.stroke();
    ctx.lineWidth = 1;
    ctx.fillStyle = '#ffd52a';
    ctx.fillRect(cx2 + Math.sin(ang2) * 32 - 3, 114 - Math.cos(ang2) * 32 - 3, 6, 6);
    ctx.fillStyle = '#6f6790';
    ctx.font = 'bold 8px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('60', cx2, 96);
    ctx.textAlign = 'left';
    ctx.fillStyle = '#8a5a2a';                                    /* the hat */
    ctx.fillRect(cx2 - 22, 62, 44, 4);
    ctx.fillRect(cx2 - 12, 50, 24, 13);
    ctx.fillStyle = '#5a3a16'; ctx.fillRect(cx2 - 12, 59, 24, 3);
    for (i = 0; i < 6; i++) {                                     /* gray notes, falling like sad rain */
      var ny4 = ((t * 0.03) + i * 34) % 170 - 10;
      var nx4 = 24 + i * 38;
      ctx.fillStyle = '#4a4a5a';
      ctx.fillRect(nx4, ny4 + 1, 2, 6); ctx.fillRect(nx4, ny4, 5, 2);
    }
  } else if (c === 5) {
    /* shizzle raises the golden drumstick. the world's notes drain into it. */
    ctx.strokeStyle = (Math.floor(t / 260) % 2) ? '#3a1060' : '#5a1a20';
    ctx.beginPath();
    ctx.moveTo(0, 30); ctx.lineTo(60, 48); ctx.lineTo(30, 90); ctx.lineTo(80, 120);
    ctx.moveTo(240, 40); ctx.lineTo(190, 60); ctx.lineTo(215, 100); ctx.lineTo(170, 130);
    ctx.stroke();
    ctx.fillStyle = '#14141e';
    ctx.fillRect(102, 66, 36, 50);
    ctx.fillRect(134, 50, 8, 22);
    if (head.complete && head.naturalWidth) {
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(head, 102, 24, 36, 44);
    }
    ctx.fillStyle = '#ffd52a';
    ctx.fillRect(139, 28, 3, 24);
    var N = 8;
    for (var j = 0; j < N; j++) {
      var pph = ((t / 1500) + j / N) % 1;
      var rr = 100 * (1 - pph) + 6;
      var aa = pph * 7 + j * 2.4;
      var nx = 140 + Math.cos(aa) * rr;
      var ny = 38 + Math.sin(aa) * rr * 0.6;
      ctx.fillStyle = pph > 0.85 ? '#ffd52a' : '#2ad9ff';
      ctx.fillRect(nx, ny + 1, 2, 5);
      ctx.fillRect(nx, ny, 5, 2);

    ctx.font = 'bold 11px monospace';
    ctx.textAlign = 'center';
    ctx.fillStyle = sh5 ? '#ff2a2a' : '#ff8a8a';
    ctx.fillText('MWA HA HA HA!', 62 + (sh5 ? 1 : -1), 36);
    ctx.textAlign = 'left';
  } else {
    /* you. alone. motivated. */
    introSprite(112, 70, false);
  }
}

/* the music toggle — remembered across the whole secret wing */
var mtog = document.getElementById('musictoggle');
function mtogLabel() { mtog.textContent = '♪ music: ' + (MUSIC_OFF ? 'off' : 'on'); }
mtog.addEventListener('click', function (e) {
  e.preventDefault();
  MUSIC_OFF = !MUSIC_OFF;
  try { sessionStorage.setItem('gtg_music_off', MUSIC_OFF ? '1' : '0'); } catch (er) {}
  if (!MUSIC_OFF) audio(); /* the click doubles as the unlock gesture */
  mtogLabel();
});

window.__dungeon = state; // debug/test handle
window.__music = { name: function () { return bgm.name; },
                   off: function () { return MUSIC_OFF; } };
var lastTs = 0;
function loop(ts) {
  var dt = lastTs ? Math.min(ts - lastTs, 50) : 16.7;
  lastTs = ts;
  state.t += dt / (1000 / 60); // fractional 60fps-equivalent ticks
  if (state.phase === 'intro') {
    if (!REDUCED) state.iT += dt;
    drawIntro();
    requestAnimationFrame(loop);
    return;
  }
  if (state.moving) {
    state.moving.p += dt / MS_PER_TILE;
    var m = state.moving;
    if (m.p >= 1) {
      state.px = m.nx; state.py = m.ny; state.ox = 0; state.oy = 0;
      state.moving = null;
      state.stepReadyAt = ts + (state.autoRep ? REPEAT_NEXT : REPEAT_FIRST);
      stepped(state.px, state.py);
      if (state.queued) { var q = state.queued; state.queued = null; startStep(q, false); }
    } else {
      state.ox = DIRS[m.d][0] * m.p * TILE;
      state.oy = DIRS[m.d][1] * m.p * TILE;
    }
  } else tryMove(ts);
  draw();
  requestAnimationFrame(loop);
}
if (introSeen()) endIntro(); else startIntro();
requestAnimationFrame(loop);
})();
</script>
